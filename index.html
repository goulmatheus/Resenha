<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resenha Canguçu · Central de Campeonatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--blue:#004AAB;--blue2:#00347a;--red:#E52A17;--yellow:#FFB900;--bg:#F4F4F4;--card:#fff;--ink:#0f1b33;--mut:#5d6779;--line:#e2e6ee;--ok:#1a9a54;--soft:#eaf1fb}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Barlow',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
button{font:inherit;cursor:pointer}
.sp{flex:1}
/* topo */
.top{background:var(--blue);color:#fff;border-bottom:4px solid var(--yellow);position:sticky;top:0;z-index:20}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;border:3px solid var(--red);flex:none}
.brand{line-height:1.05;cursor:pointer;display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;text-align:left;padding:0}
.brand b{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;text-transform:uppercase;display:block}
.brand small{opacity:.8;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block}
.chip{font-size:12.5px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#7ee2a8;display:inline-block}
.dot.off{background:var(--yellow)}
.editbar{background:var(--yellow);color:#1b1b1b;font-weight:600;text-align:center;padding:6px 10px;font-size:14px}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 70px}
/* botões */
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--blue);color:#fff}
.btn:hover{background:var(--blue2)}
.btn.red{background:var(--red)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.yel{background:var(--yellow);color:#1b1b1b}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid #f3c5bf}
.btn.sm{padding:6px 11px;font-size:14px;border-radius:8px}
.btn.on{background:var(--yellow);color:#1b1b1b}
.top .btn{background:rgba(255,255,255,.16)}
.top .btn.on{background:var(--yellow);color:#1b1b1b}
.top .btn:hover{background:rgba(255,255,255,.28)}
/* home */
.hero{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:6px 0 18px}
.hero h1{font-size:40px;line-height:1;text-transform:uppercase;color:var(--blue);font-weight:800}
.hero p{margin:8px 0 0;color:var(--mut);max-width:560px}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.cc{background:var(--card);border-radius:16px;border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column}
.cc:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,40,110,.12)}
.cc .band{height:8px;background:linear-gradient(90deg,var(--blue) 0 55%,var(--red) 55% 80%,var(--yellow) 80%)}
.cc .in{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.cc .hd{display:flex;gap:12px;align-items:center}
.cc h3{font-size:26px;line-height:1.05;text-transform:uppercase}
.meta{color:var(--mut);font-size:14px}
.st{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--blue)}
.st.go{background:#e5f6ec;color:var(--ok)} .st.end{background:#fff3d1;color:#8a5b00}
.nums{display:flex;gap:18px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.nums div{font-size:13px;color:var(--mut)} .nums b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:26px;color:var(--ink);line-height:1}
.champ-line{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.cc.new{border:2px dashed #b7c6e4;background:transparent;align-items:center;justify-content:center;min-height:190px;color:var(--blue);font-weight:700;font-size:18px;gap:6px}
.cc.new:hover{background:var(--soft);transform:none;box-shadow:none}
.empty{background:var(--card);border:1.5px dashed #c5cfe3;border-radius:16px;padding:34px 20px;text-align:center;color:var(--mut)}
.empty h3{color:var(--ink);font-size:24px;margin-bottom:6px}
.empty .btn{margin-top:14px}
/* campeonato */
.cbanner{background:linear-gradient(120deg,var(--blue),var(--blue2));color:#fff;border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:16px;border-bottom:5px solid var(--yellow);margin-bottom:12px;position:relative;overflow:hidden}
.cbanner:after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.cbanner h1{font-size:40px;line-height:1;text-transform:uppercase;font-weight:800}
.cbanner .meta{color:rgba(255,255,255,.82);margin-top:6px}
.cbanner .st{background:rgba(255,255,255,.18);color:#fff}
.cbanner .st.go{background:#d3f3e0;color:#0d6a39}
.back{background:none;border:0;color:var(--blue);font-weight:600;padding:0;margin-bottom:8px;font-size:15px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:10px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--blue);border-bottom-color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.card>.th{padding:12px 16px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;text-transform:uppercase;color:#fff;background:var(--blue);display:flex;align-items:center;gap:10px}
.card>.th small{font-family:'Barlow',sans-serif;font-weight:500;opacity:.85;text-transform:none;font-size:13px}
.card>.th.rd{background:var(--red)}
.card>.th.yl{background:var(--yellow);color:#1b1b1b}
.card .pad{padding:14px 16px}
/* tabela */
table{border-collapse:collapse;width:100%}
th,td{padding:9px 8px;text-align:center;font-size:15px;border-top:1px solid var(--line)}
thead th{border-top:0;background:#f7f9fd;font-size:12.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
tbody tr:nth-child(even){background:#fbfcfe}
td.l,th.l{text-align:left}
td.pos{width:34px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;color:var(--mut)}
td.pts{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;color:var(--blue)}
tr.q td.pos{box-shadow:inset 5px 0 0 var(--blue);color:var(--blue)}
.tn{display:flex;align-items:center;gap:9px;font-weight:600;min-width:0}
.tn span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form{display:inline-flex;gap:3px}
.form i{width:18px;height:18px;border-radius:5px;font-style:normal;font-size:11px;font-weight:700;color:#fff;display:grid;place-items:center}
.form .V{background:var(--ok)} .form .E{background:#9aa4b6} .form .D{background:var(--red)}
.legend{padding:10px 16px;font-size:13px;color:var(--mut);border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-left:5px solid var(--blue);margin-right:6px;vertical-align:-1px}
.bd{--c:#004AAB;--t:#fff;display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 5px;border-radius:50%;background:var(--c);color:var(--t);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:.02em;flex:none;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1.5px var(--line);overflow:hidden}
.bd.lg{min-width:64px;height:64px;font-size:22px}
.bd.xl{min-width:96px;height:96px;font-size:30px}
.bd.sm{min-width:26px;height:26px;font-size:11px}
.bd.has{background:#fff;padding:2px}
.bd img{width:100%;height:100%;object-fit:contain;display:block;border-radius:50%}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;font-weight:700;font-size:11.5px;padding:2px 9px;border-radius:99px;letter-spacing:.07em;text-transform:uppercase}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
/* jogos */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,input,textarea{font:inherit;color:inherit;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.filters select{width:auto;min-width:150px}
.gm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.gm:first-of-type{border-top:0}
.gm:hover{background:#f6f9ff}
.gm .tm{display:flex;align-items:center;gap:9px;min-width:0;font-weight:600}
.gm .tm.h{justify-content:flex-end;text-align:right}
.gm .tm .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;min-width:86px;text-align:center;background:var(--blue);color:#fff;border-radius:9px;padding:2px 10px;line-height:1.25}
.sc i{font-style:normal;opacity:.7;font-size:18px;margin:0 2px}
.sc.pend{background:#eef1f7;color:var(--mut);font-size:19px}
.sc.lv{background:var(--red)}
.gmeta{grid-column:1/-1;font-size:13px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.gmeta:empty{display:none}
.tag{background:var(--soft);color:var(--blue);border-radius:6px;padding:0 7px;font-weight:600;font-size:12px}
/* mata-mata */
.br{display:flex;gap:24px;overflow-x:auto;padding:4px 2px 16px}
.brc{min-width:238px;flex:none;display:flex;flex-direction:column;gap:10px}
.brh{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);font-size:17px;border-bottom:3px solid var(--yellow);padding-bottom:3px}
.bms{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.bm{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.bm:hover{box-shadow:0 4px 14px rgba(0,40,110,.14)}
.bt{display:flex;align-items:center;gap:8px;padding:8px 10px}
.bt+.bt{border-top:1px solid var(--line)}
.bt .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.bt.w .nm{font-weight:700}
.bt .g{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:21px;min-width:22px;text-align:right}
.bt .g small{font-size:12px;color:var(--mut);font-weight:600}
.bt.w .g{color:var(--blue)}
.bt.tbd .nm{color:#98a1b3;font-style:italic}
.trophy{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:16px;margin-bottom:16px;border-bottom:5px solid var(--yellow)}
.trophy small{opacity:.8;text-transform:uppercase;letter-spacing:.1em;font-size:12px;display:block}
.trophy b{font-family:'Barlow Condensed',sans-serif;font-size:34px;text-transform:uppercase;line-height:1.05}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-left:5px solid var(--blue)}
.kpi:nth-child(3n+2){border-left-color:var(--red)} .kpi:nth-child(3n){border-left-color:var(--yellow)}
.kpi small{color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;display:block}
.kpi b{font-family:'Barlow Condensed',sans-serif;font-size:34px;line-height:1.1;display:block}
.kpi span{font-size:14px;color:var(--mut)}
.kpi .who{display:flex;align-items:center;gap:8px;margin-top:6px;font-weight:600;color:var(--ink);font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cd{display:inline-block;width:12px;height:17px;border-radius:2px;background:var(--yellow);vertical-align:-3px;margin-right:4px}
.cd.r{background:var(--red)}
.ht{background:var(--yellow);color:#1b1b1b;border-radius:6px;font-size:11px;font-weight:700;padding:1px 6px;margin-left:6px}
.sub{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;color:var(--blue);margin:22px 0 10px}
/* cenários */
.bar{height:14px;border-radius:8px;background:#e8ebf2;overflow:hidden;display:flex;min-width:110px}
.bar i{display:block;height:100%}
.bar .s{background:var(--ok)}
.bar .p{background:repeating-linear-gradient(45deg,var(--yellow),var(--yellow) 4px,#ffd35c 4px,#ffd35c 8px)}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--blue);white-space:nowrap}
.pill.ok{background:#e5f6ec;color:var(--ok)} .pill.no{background:#fdecea;color:var(--red)} .pill.op{background:#fff3d1;color:#8a5b00}
.opt{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.opt button{border:0;background:#fff;padding:6px 12px;font-weight:700;color:var(--mut)}
.opt button+button{border-left:1.5px solid var(--line)}
.opt button.on{background:var(--blue);color:#fff}
.simrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.simrow .t{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.simrow .t.r{justify-content:flex-end;text-align:right}
/* times */
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.tc .top2{display:flex;align-items:center;gap:12px}
.tc h3{font-size:24px;text-transform:uppercase;line-height:1}
.tc ul{margin:0;padding-left:18px;color:var(--mut);font-size:14px;columns:2;column-gap:14px}
.tc .acts{display:flex;gap:6px;margin-top:auto}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,20,45,.55);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;overflow:auto}
.md{background:#fff;border-radius:18px;width:min(600px,100%);padding:20px 20px 18px;border-top:6px solid var(--blue);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.md.wide{width:min(860px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mh h2{font-size:28px;text-transform:uppercase;color:var(--blue)}
.x{border:0;background:none;font-size:30px;line-height:1;color:var(--mut);padding:0 6px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:10px}
label>input,label>select,label>textarea{margin-top:4px;color:var(--ink);font-weight:400}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.err{color:var(--red);font-weight:600;font-size:14px;min-height:0;margin:4px 0}
.mf-actions{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mut);margin:-4px 0 10px}
.sep{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;text-transform:uppercase;color:var(--blue);margin:14px 0 8px;border-bottom:2px solid var(--line);padding-bottom:3px;display:flex;align-items:center;justify-content:space-between}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);font-weight:600}
.chk input{width:auto}
.warn{background:#fff3d1;border-left:5px solid var(--yellow);padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:14px}
textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:200px}
.lgup{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.filebtn{position:relative;overflow:hidden;display:inline-block;cursor:pointer;margin:0}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.tbr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.tbr.off{opacity:.55}
.tbr .chk{margin:0}
.tbr button{border:1.5px solid var(--line);background:#fff;border-radius:8px;width:34px;height:32px;font-weight:700;color:var(--blue)}
/* painel da partida */
.pn-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pn-score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-radius:16px;padding:14px 12px;border-bottom:5px solid var(--yellow)}
.pn-team{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pn-team b{font-family:'Barlow Condensed',sans-serif;font-size:22px;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.pn-num{display:flex;align-items:center;gap:6px}
.pn-num .n{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:68px;line-height:1;min-width:56px;text-align:center}
.pn-num .sx{font-size:30px;opacity:.6;font-weight:700}
.rnd{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;font-size:24px;font-weight:700;line-height:1;padding:0}
.rnd:hover{background:rgba(255,255,255,.28)}
.pn-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.pn-col{border:1.5px solid var(--line);border-radius:14px;padding:10px}
.pn-col h4{margin:0 0 8px;font-family:'Barlow Condensed',sans-serif;font-size:19px;text-transform:uppercase;color:var(--blue)}
.big{display:block;width:100%;min-height:52px;border-radius:12px;border:0;font-weight:700;font-size:16px;margin-bottom:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.big.y{background:var(--yellow);color:#1b1b1b} .big.r{background:var(--red)} .big.g{background:#fff;color:var(--blue);border:1.5px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chp{padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;min-height:46px}
.chp:hover{border-color:var(--blue);background:var(--soft)}
.chp.skip{border-style:dashed;color:var(--mut)}
.pick{background:var(--soft);border:1.5px solid #bfd3f2;border-radius:14px;padding:12px;margin:14px 0}
.pick h4{margin:0;font-family:'Barlow Condensed',sans-serif;font-size:22px;text-transform:uppercase;color:var(--blue)}
.cust{display:flex;gap:8px;margin-top:6px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.tl .mn{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--mut);min-width:34px}
.tl .rm{margin-left:auto;border:0;background:#fdecea;color:var(--red);border-radius:8px;width:30px;height:30px;font-weight:700}
.vh{text-align:center;padding:6px 0 10px}
.vh .row{display:flex;align-items:center;justify-content:center;gap:12px}

<body>
<header class="top"><div class="top-in">
  <button class="brand" data-act="home" aria-label="Início"><span class="logo">RC</span><span><b>Resenha Canguçu</b><small>Central de campeonatos</small></span></button>
  <span class="sp"></span>
  <span id="top-right" style="display:flex;gap:8px;align-items:center"></span>
</div></header>
<div id="bar"></div>
<main class="wrap" id="app"><div class="loading">Carregando campeonatos…</div></main>
<div id="modal"></div>
<div id="toast"></div>
<script>
// ============ LÓGICA (pura) ============
// <logic>
const FORMATS={liga:'Pontos corridos',grupos:'Grupos + mata-mata',mata:'Mata-mata'};
const SPORTS=['Futebol de campo','Futsal','Society','Futebol 7','Handebol','Outro'];
const TB={v:'Mais vitórias',sg:'Saldo de gols',gp:'Mais gols marcados',gc:'Menos gols sofridos',h2h:'Confronto direto: pontos',h2hsg:'Confronto direto: saldo de gols',h2hgp:'Confronto direto: gols marcados',fp:'Fair play (menos cartões)',seed:'Ordem definida pela organização'};
const TB_DEFAULT=['v','sg','gp'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=(p='')=>p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const safeColor=v=>/^#[0-9a-f]{6}$/i.test(v||'')?v:'#004AAB';
const safeImg=v=>(typeof v==='string'&&v.length<260000&&/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(v))?v:'';
const txtOn=hex=>{const n=parseInt(safeColor(hex).slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return(0.299*r+0.587*g+0.114*b)>165?'#111827':'#ffffff'};
const num=v=>{if(v===''||v==null)return null;const n=parseInt(v,10);return Number.isFinite(n)&&n>=0?n:null};

function newChamp(o){
  const gc=Math.min(8,Math.max(2,o.groupsCount||2));
  return{id:o.id,name:o.name,sport:o.sport||SPORTS[0],season:o.season||'',format:o.format,turns:o.turns===2?2:1,logo:o.logo||'',
    pts:{w:o.pw??3,d:o.pd??1,l:o.pl??0},tiebreak:[...TB_DEFAULT],
    groups:o.format==='grupos'?Array.from({length:gc},(_,i)=>String.fromCharCode(65+i)):[],
    advance:o.advance??(o.format==='grupos'?2:0),teams:[],games:[],createdAt:Date.now(),updatedAt:Date.now()};
}
function mkGame(o){return Object.assign({id:uid('g'),phase:'liga',round:1,group:'',kr:0,ks:0,home:null,away:null,bye:false,hs:null,as:null,ph:null,pa:null,played:false,live:false,date:'',time:'',venue:'',events:[]},o)}
const counted=g=>!!(g.played||g.live);
const teamsOf=(c,g)=>c.teams.filter(t=>(t.group||'')===(g||''));
const tmById=(c,id)=>c.teams.find(t=>t.id===id)||null;
const seedOf=(c,id)=>{const t=tmById(c,id);return t&&t.seed!=null&&t.seed!==''?Number(t.seed):9999};

// ---- classificação com critérios de desempate configuráveis ----
function critVal(c,k,set,games){
  const v={},ids=new Set(set.map(r=>r.id));
  if(k==='h2h'||k==='h2hsg'||k==='h2hgp'){
    set.forEach(r=>v[r.id]=0);
    for(const g of games){
      if(!ids.has(g.home)||!ids.has(g.away))continue;
      const hs=g.hs||0,as=g.as||0;
      if(k==='h2h'){if(hs>as){v[g.home]+=c.pts.w;v[g.away]+=c.pts.l}else if(hs<as){v[g.away]+=c.pts.w;v[g.home]+=c.pts.l}else{v[g.home]+=c.pts.d;v[g.away]+=c.pts.d}}
      else if(k==='h2hsg'){v[g.home]+=hs-as;v[g.away]+=as-hs}
      else{v[g.home]+=hs;v[g.away]+=as}
    }
    return v;
  }
  set.forEach(r=>{v[r.id]=k==='v'?r.v:k==='sg'?r.sg:k==='gp'?r.gp:k==='gc'?-r.gc:k==='fp'?-r.fp:k==='seed'?-seedOf(c,r.id):0});
  return v;
}
function tieBreak(c,set,crit,games){
  if(set.length<2)return set;
  const nm=id=>(tmById(c,id)||{}).name||'';
  if(!crit.length)return[...set].sort((a,b)=>seedOf(c,a.id)-seedOf(c,b.id)||nm(a.id).localeCompare(nm(b.id),'pt-BR'));
  const[k,...rest]=crit,val=critVal(c,k,set,games);
  const levels=[...new Set(set.map(r=>val[r.id]))].sort((a,b)=>b-a);
  return levels.flatMap(x=>tieBreak(c,set.filter(r=>val[r.id]===x),rest,games));
}
function rankRows(c,rows,games){
  const crit=(Array.isArray(c.tiebreak)?c.tiebreak:TB_DEFAULT).filter(k=>TB[k]);
  const sorted=[...rows].sort((a,b)=>b.p-a.p),out=[];
  let i=0;
  while(i<sorted.length){let j=i;while(j<sorted.length&&sorted[j].p===sorted[i].p)j++;out.push(...tieBreak(c,sorted.slice(i,j),crit,games));i=j}
  return out;
}
function standings(c,g){
  const rows={};
  teamsOf(c,g).forEach(t=>rows[t.id]={id:t.id,p:0,j:0,v:0,e:0,d:0,gp:0,gc:0,fp:0,form:[]});
  const gs=c.games.filter(x=>x.phase==='liga'&&counted(x)&&rows[x.home]&&rows[x.away])
    .sort((a,b)=>(a.round||0)-(b.round||0)||String(a.date||'').localeCompare(String(b.date||'')));
  for(const x of gs){
    const h=rows[x.home],a=rows[x.away],hs=x.hs||0,as=x.as||0;
    h.j++;a.j++;h.gp+=hs;h.gc+=as;a.gp+=as;a.gc+=hs;
    if(hs>as){h.v++;a.d++;h.p+=c.pts.w;a.p+=c.pts.l;h.form.push('V');a.form.push('D')}
    else if(hs<as){a.v++;h.d++;a.p+=c.pts.w;h.p+=c.pts.l;a.form.push('V');h.form.push('D')}
    else{h.e++;a.e++;h.p+=c.pts.d;a.p+=c.pts.d;h.form.push('E');a.form.push('E')}
    for(const e of x.events||[]){const r=rows[e.team];if(r){if(e.type==='ama')r.fp+=1;else if(e.type==='ver')r.fp+=3}}
  }
  const list=Object.values(rows).map(r=>({...r,sg:r.gp-r.gc,apr:(r.j&&c.pts.w>0)?Math.round(r.p/(r.j*c.pts.w)*100):0}));
  return rankRows(c,list,gs).map(r=>({...r,form:r.form.slice(-5)}));
}

// ---- tabela de jogos / chaveamento ----
function roundRobin(ids){
  const arr=[...ids];if(arr.length%2)arr.push(null);
  const n=arr.length,rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];if(a&&b)pairs.push(r%2?[b,a]:[a,b])}
    rounds.push(pairs);arr.splice(1,0,arr.pop());
  }
  return rounds;
}
function genFixtures(c){
  c.games=c.games.filter(g=>g.phase==='ko');
  const groups=c.format==='grupos'?c.groups:[''];
  for(const gr of groups){
    const ids=teamsOf(c,gr).map(t=>t.id);if(ids.length<2)continue;
    let rounds=roundRobin(ids);
    if(c.turns===2)rounds=rounds.concat(rounds.map(r=>r.map(([h,a])=>[a,h])));
    rounds.forEach((pairs,i)=>pairs.forEach(([h,a])=>c.games.push(mkGame({phase:'liga',round:i+1,group:gr,home:h,away:a}))));
  }
  return c.games.filter(g=>g.phase==='liga').length;
}
function bracketOrder(size){let o=[1];while(o.length<size){const n=o.length*2;o=o.flatMap(x=>[x,n+1-x])}return o}
function genBracket(c,seeds){
  c.games=c.games.filter(g=>g.phase!=='ko');
  let size=2;while(size<seeds.length)size*=2;
  const ord=bracketOrder(size),R=Math.log2(size);
  for(let r=0;r<R;r++){
    const cnt=size/2**(r+1);
    for(let s=0;s<cnt;s++){
      const g=mkGame({phase:'ko',kr:r,ks:s,round:0});
      if(r===0){g.home=seeds[ord[2*s]-1]||null;g.away=seeds[ord[2*s+1]-1]||null;g.bye=!g.away}
      c.games.push(g);
    }
  }
}
const koList=c=>c.games.filter(g=>g.phase==='ko');
const koRounds=c=>koList(c).reduce((m,g)=>Math.max(m,g.kr+1),0);
const koGame=(c,r,s)=>c.games.find(g=>g.phase==='ko'&&g.kr===r&&g.ks===s)||null;
function koRoundName(R,r){const rem=R-1-r;return rem===0?'Final':rem===1?'Semifinal':rem===2?'Quartas de final':rem===3?'Oitavas de final':'Fase '+(r+1)}
function koTeams(c,g){
  if(!g.kr)return[g.home||null,g.away||null];
  const a=koGame(c,g.kr-1,g.ks*2),b=koGame(c,g.kr-1,g.ks*2+1);
  return[a?koWinner(c,a):null,b?koWinner(c,b):null];
}
function koWinner(c,g){
  const[h,a]=koTeams(c,g);
  if(g.bye)return h||a||null;
  if(!g.played||!h||!a)return null;
  const hs=g.hs||0,as=g.as||0;
  if(hs>as)return h;if(as>hs)return a;
  if(g.ph!=null&&g.pa!=null&&g.ph!==g.pa)return g.ph>g.pa?h:a;
  return null;
}
const gTeams=(c,g)=>g.phase==='ko'?koTeams(c,g):[g.home,g.away];
function champion(c){
  const R=koRounds(c);
  if(R){const f=koGame(c,R-1,0);return f?koWinner(c,f):null}
  if(c.format==='liga'){
    const lg=c.games.filter(g=>g.phase==='liga');
    if(lg.length&&lg.every(g=>g.played)){const s=standings(c,'');return s[0]?s[0].id:null}
  }
  return null;
}
function champStatus(c){
  const real=c.games.filter(g=>!g.bye),played=real.filter(g=>g.played).length,live=real.filter(g=>g.live&&!g.played).length;
  if(champion(c))return{k:'end',t:'Encerrado',played,total:real.length,live};
  if(!real.length)return{k:'',t:'Em organização',played,total:0,live};
  if(!played&&!live)return{k:'',t:'Aguardando início',played,total:real.length,live};
  return{k:'go',t:'Em andamento',played,total:real.length,live};
}
function seedList(c,q,shuf){
  let ids=[];
  if(c.format==='grupos'){const tb=c.groups.map(g=>standings(c,g).map(r=>r.id));for(let i=0;i<q;i++)tb.forEach(t=>{if(t[i])ids.push(t[i])})}
  else if(c.format==='liga')ids=standings(c,'').slice(0,q).map(r=>r.id);
  else ids=c.teams.slice(0,q).map(t=>t.id);
  return shuf?shuffled(ids):ids;
}
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ---- eventos da partida (painel) ----
// gol: team = quem marcou; gc (gol contra): team = time do jogador que fez contra
function evDelta(h,a,e){
  if(e.type==='gol')return e.team===h?[1,0]:[0,1];
  if(e.type==='gc')return e.team===h?[0,1]:[1,0];
  return[0,0];
}
function addEvent(c,g,ev){
  const[h,a]=gTeams(c,g);
  const e=Object.assign({id:uid('e'),type:'gol',team:null,player:'',ast:'',min:null},ev);
  if(!e.team||(e.team!==h&&e.team!==a))return null;
  g.events=g.events||[];g.events.push(e);
  const[dh,da]=evDelta(h,a,e);
  g.hs=(g.hs||0)+dh;g.as=(g.as||0)+da;
  if(!g.played&&!g.live)g.live=true;
  return e;
}
function removeEvent(c,g,id){
  const[h,a]=gTeams(c,g),i=(g.events||[]).findIndex(e=>e.id===id);
  if(i<0)return false;
  const e=g.events.splice(i,1)[0],[dh,da]=evDelta(h,a,e);
  g.hs=Math.max(0,(g.hs||0)-dh);g.as=Math.max(0,(g.as||0)-da);
  return true;
}
// "−" no placar: remove o último gol daquele lado; sem evento, só desconta do placar
function minusGoal(c,g,side){
  const[h,a]=gTeams(c,g),want=side==='h'?0:1;
  const ev=[...(g.events||[])].reverse().find(e=>{const d=evDelta(h,a,e);return d[want]===1});
  if(ev)return removeEvent(c,g,ev.id);
  if(side==='h'&&(g.hs||0)>0){g.hs--;return true}
  if(side==='a'&&(g.as||0)>0){g.as--;return true}
  return false;
}

// ---- estatísticas ----
function totals(c){
  const T={};c.teams.forEach(t=>T[t.id]={id:t.id,j:0,v:0,e:0,d:0,gp:0,gc:0,ama:0,ver:0});
  let goals=0,games=0,big=null,most=null;
  for(const g of c.games){
    if(g.bye||!counted(g))continue;
    const[h,a]=gTeams(c,g),hs=g.hs||0,as=g.as||0;
    goals+=hs+as;games++;
    const diff=Math.abs(hs-as);
    if(!big||diff>big.diff)big={g:g.id,diff,h,a,hs,as};
    if(!most||hs+as>most.tot)most={g:g.id,tot:hs+as,h,a,hs,as};
    for(const[x,gf,ga]of[[h,hs,as],[a,as,hs]]){
      const t=T[x];if(!t)continue;
      t.j++;t.gp+=gf;t.gc+=ga;
      if(gf>ga)t.v++;else if(gf<ga)t.d++;else t.e++;
    }
    for(const e of g.events||[]){const t=T[e.team];if(t){if(e.type==='ama')t.ama++;else if(e.type==='ver')t.ver++}}
  }
  return{T:Object.values(T),goals,games,big,most};
}
function pstats(c){
  const m={},hat=[];
  const get=(team,p)=>{const k=(team||'')+'|'+p.trim().toLowerCase();return m[k]||(m[k]={player:p.trim(),team,gol:0,ast:0,ama:0,ver:0,gc:0})};
  for(const g of c.games){
    const per={};
    for(const e of g.events||[]){
      if(e.type==='gol'){
        if(e.player){const o=get(e.team,e.player);o.gol++;const k=o.player.toLowerCase()+'|'+e.team;(per[k]||(per[k]={player:o.player,team:e.team,n:0})).n++}
        if(e.ast)get(e.team,e.ast).ast++;
      }else if(e.type==='gc'&&e.player)get(e.team,e.player).gc++;
      else if((e.type==='ama'||e.type==='ver')&&e.player)get(e.team,e.player)[e.type]++;
    }
    for(const k in per)if(per[k].n>=3)hat.push(per[k]);
  }
  return{list:Object.values(m),hat};
}

// ---- cenários de classificação (somente pontos; empates dependem dos critérios) ----
function scenarioCalc(c,group){
  const adv=c.advance||0,rows=standings(c,group),ids=rows.map(r=>r.id),inSet=new Set(ids);
  const rem=c.games.filter(g=>g.phase==='liga'&&!counted(g)&&inSet.has(g.home)&&inSet.has(g.away));
  const base={};rows.forEach(r=>base[r.id]=r.p);
  const info={};
  const left={};ids.forEach(i=>left[i]=0);rem.forEach(g=>{left[g.home]++;left[g.away]++});
  rows.forEach((r,i)=>info[r.id]={id:r.id,p:r.p,max:r.p+left[r.id]*c.pts.w,min:r.p+left[r.id]*c.pts.l,left:left[r.id],pos:i+1});
  const res={adv,rows,rem:rem.length,info,list:rows.map(r=>info[r.id])};
  if(!adv||rows.length<2){res.off=true;return res}
  if(rem.length===0){rows.forEach((r,i)=>{info[r.id].sure=i<adv?1:0;info[r.id].poss=i<adv?1:0;info[r.id].status=i<adv?'classificado':'eliminado'});return res}
  if(rem.length>10){res.many=true;return res}
  const n=rem.length,total=Math.pow(3,n),sure={},poss={};
  ids.forEach(i=>{sure[i]=0;poss[i]=0});
  for(let m=0;m<total;m++){
    const p={...base};let x=m;
    for(let k=0;k<n;k++){
      const o=x%3;x=(x-o)/3;const g=rem[k];
      if(o===0){p[g.home]+=c.pts.w;p[g.away]+=c.pts.l}else if(o===1){p[g.home]+=c.pts.d;p[g.away]+=c.pts.d}else{p[g.away]+=c.pts.w;p[g.home]+=c.pts.l}
    }
    for(const i of ids){
      let gt=0,eq=0;
      for(const j of ids){if(j===i)continue;if(p[j]>p[i])gt++;else if(p[j]===p[i])eq++}
      if(1+gt+eq<=adv)sure[i]++;
      if(1+gt<=adv)poss[i]++;
    }
  }
  ids.forEach(i=>{const o=info[i];o.sure=sure[i]/total;o.poss=poss[i]/total;o.status=sure[i]===total?'classificado':poss[i]===0?'eliminado':'aberto'});
  return res;
}
function simStandings(c,group,sim){
  const mp={h:[1,0],d:[0,0],a:[0,1]};
  const cc={...c,games:c.games.map(g=>sim&&sim[g.id]&&!counted(g)?{...g,played:true,hs:mp[sim[g.id]][0],as:mp[sim[g.id]][1],events:[]}:g)};
  return standings(cc,group);
}

const saveSt={};
const isDirty=id=>{const s=saveSt[id];return !!(s&&(s.timer||s.busy||s.again||s.failed))};
const anySaving=()=>Object.values(saveSt).some(s=>s.timer||s.busy||s.again);
function readySync(){return S.session?'Conectado':'Somente leitura'}
function setSync(t,err){S.sync=t;S.syncErr=err||'';renderTop()}
function queueSave(id){
  const st=saveSt[id]||(saveSt[id]={});
  clearTimeout(st.timer);
  st.timer=setTimeout(()=>{st.timer=null;flush(id)},400);
  if(S.cloud)setSync('Salvando…');
}
async function flush(id){
  const st=saveSt[id]||(saveSt[id]={});
  if(st.busy){st.again=true;return}
  st.busy=true;
  try{
    const c=S.champs[id];
    if(sb){
      if(c){const r=await sb.from('campeonatos').upsert({id,data:JSON.parse(JSON.stringify(c)),updated_at:new Date().toISOString()});if(r.error)throw r.error}
      else{const r=await sb.from('campeonatos').delete().eq('id',id);if(r.error)throw r.error;delete S.deleting[id]}
      st.failed=false;
      if(!st.again&&!st.timer)setSync(readySync());
    }else{persistLocal();if(!c)delete S.deleting[id]}
  }catch(e){
    st.failed=true;
    const msg=(e&&(e.message||e.details))||String(e);
    const perm=e&&(e.code==='42501'||e.status===401||e.status===403||/row-level security|jwt|permission/i.test(msg));
    if(perm){toast('Sem permissão para salvar. Entre novamente com seu usuário.');S.edit=false}
    else toast('Não consegui salvar: '+msg.slice(0,140));
    setSync('Erro ao salvar',msg);render();
  }
  st.busy=false;
  if(st.again){st.again=false;flush(id)}
}
function commit(c){c.updatedAt=Date.now();queueSave(c.id);render()}

function setSession(s){
  S.session=s||null;S.canEdit=sb?!!s:true;if(!S.canEdit)S.edit=false;
  if(S.loaded&&!anySaving()&&!/^Sem |Erro/.test(S.sync))S.sync=readySync();
  render();
}
async function loadAll(first){
  if(!sb)return;
  let res;
  try{res=await sb.from('campeonatos').select('id,data')}catch(e){res={error:e}}
  if(res.error){if(first||!S.loaded){S.loaded=true;setSync('Sem acesso aos dados',(res.error.message||'')+'');render()}return}
  const next={};
  (res.data||[]).forEach(r=>{if(r&&r.data&&!S.deleting[r.id])next[r.id]=r.data});
  for(const id in S.champs){
    const loc=S.champs[id];if(!loc)continue;
    if(isDirty(id)||(next[id]&&(loc.updatedAt||0)>(next[id].updatedAt||0)))next[id]=loc;
  }
  const sig=JSON.stringify(next),was=S.loaded;
  S.loaded=true;
  if(sig!==S.sig||!was){S.sig=sig;S.champs=next;if(!anySaving())S.sync=readySync();render()}
  else if(!anySaving()&&S.sync!==readySync()){setSync(readySync())}
}
function applyRealtime(p){
  const id=(p.new&&p.new.id)||(p.old&&p.old.id);
  if(!id||isDirty(id))return;
  if(p.eventType==='DELETE')delete S.champs[id];
  else if(p.new&&p.new.data){
    const loc=S.champs[id];
    if(loc&&(loc.updatedAt||0)>(p.new.data.updatedAt||0))return;
    S.champs[id]=p.new.data;
  }
  S.sig='';render();
}
async function initStore(){
  const lib=typeof supabase!=='undefined'&&supabase&&supabase.createClient;
  if(lib&&cfgOk()){try{sb=supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey)}catch(e){sb=null}}
  if(!sb){S.cloud=false;S.canEdit=true;S.champs=loadLocal();S.loaded=true;setSync('Modo local');render();return}
  S.cloud=true;S.canEdit=false;setSync('Conectando…');
  S.loadTimer=setTimeout(()=>{if(!S.loaded){S.loaded=true;setSync('Sem conexão com os dados');render()}},10000);
  try{const r=await sb.auth.getSession();setSession(r&&r.data&&r.data.session)}catch(e){}
  try{sb.auth.onAuthStateChange((_e,s)=>setSession(s))}catch(e){}
  await loadAll(true);clearTimeout(S.loadTimer);
  try{sb.channel('rc-campeonatos').on('postgres_changes',{event:'*',schema:'public',table:'campeonatos'},applyRealtime).subscribe()}catch(e){}
  setInterval(()=>{if(!document.hidden)loadAll(false)},S.tv?6000:25000);
  setInterval(()=>{for(const id in saveSt){const s=saveSt[id];if(s.failed&&!s.busy&&!s.timer)flush(id)}},15000);
}
window.addEventListener('beforeunload',e=>{if(Object.keys(saveSt).some(isDirty)){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)for(const id in saveSt){const s=saveSt[id];if(s.timer){clearTimeout(s.timer);s.timer=null;flush(id)}}});

        return`<tr><td class="pos">${o.pos}</td><td class="l"><div class="tn">${badge(t,'sm')}<span class="nm">${esc(t.name)}</span></div></td><td class="pts">${o.p}</td><td class="hm">${o.min}–${o.max}</td><td>${pill}</td><td class="l"><div class="bar" title="Garantida: ${s}% · Pode chegar a ${p}%"><i class="s" style="width:${s}%"></i><i class="p" style="width:${Math.max(0,p-s)}%"></i></div><small class="meta">${s}%${p>s?` (até ${p}%)`:''}</small></td></tr>`;
      }).join('')}</tbody></table></div>`;
    }
    let sim='';
    if(rem.length){
      const proj=simStandings(c,gr,S.sim);
      sim=`<div class="sep" style="margin:0;padding:10px 16px;background:#f7f9fd">Simulador <button class="btn ghost sm" data-act="simClear" data-g="${esc(gr)}">Limpar</button></div>${rem.map(g=>{
        const th=tmById(c,g.home),ta=tmById(c,g.away),v=S.sim[g.id]||'';
        return`<div class="simrow"><div class="t r"><span>${esc(th.name)}</span>${badge(th,'sm')}</div><div class="opt"><button class="${v==='h'?'on':''}" data-act="sim" data-id="${esc(g.id)}" data-v="h">1</button><button class="${v==='d'?'on':''}" data-act="sim" data-id="${esc(g.id)}" data-v="d">X</button><button class="${v==='a'?'on':''}" data-act="sim" data-id="${esc(g.id)}" data-v="a">2</button></div><div class="t">${badge(ta,'sm')}<span>${esc(ta.name)}</span></div></div>`;
      }).join('')}<div class="sep" style="margin:0;padding:10px 16px;background:#f7f9fd">Tabela projetada</div><div style="overflow-x:auto"><table>${tableHead(false)}<tbody>${tableRows(c,proj,adv,false)}</tbody></table></div><div class="legend"><span>Resultados simulados contam como 1 × 0 / 0 × 0 / 0 × 1. Só para projeção, nada é salvo.</span></div>`;
    }
    return`<div class="card"><div class="th yl">${head}<small style="color:#333">${sc.rem} jogos restantes · ${adv} vaga${adv>1?'s':''}</small></div>${tbl}${sim}</div>`;
  }).join('');
  return note+(out||emptyBlock('Sem dados','',''));
}

function jogosView(c){
  const real=c.games.filter(g=>!g.bye);
  const lgRounds=[...new Set(c.games.filter(g=>g.phase==='liga').map(g=>g.round))].sort((a,b)=>a-b);
  const R=koRounds(c);
  const tools=ED()?`<div class="tools">${c.format!=='mata'?`<button class="btn sm" data-act="genFix">Gerar tabela de jogos</button>`:''}<button class="btn ghost sm" data-act="newGame">+ Novo jogo</button></div>`:'';
  if(!real.length)return tools+emptyBlock('Nenhum jogo cadastrado',c.format==='mata'?'Gere o chaveamento na aba Mata-mata.':'Gere a tabela automaticamente a partir dos times, ou adicione jogos um a um.','');
  const f=S.flt;
  const teamOpts=`<option value="all">Todos os times</option>`+c.teams.map(t=>`<option value="${esc(t.id)}" ${f.t===t.id?'selected':''}>${esc(t.name)}</option>`).join('');
  const roundOpts=`<option value="all">Todas as fases</option>`+lgRounds.map(r=>`<option value="r${r}" ${f.r==='r'+r?'selected':''}>Rodada ${r}</option>`).join('')+(R?Array.from({length:R},(_,r)=>`<option value="k${r}" ${f.r==='k'+r?'selected':''}>${koRoundName(R,r)}</option>`).join(''):'');
  const mine=g=>f.t==='all'||gTeams(c,g).includes(f.t);
  let out='';
  const sorter=(a,b)=>String(a.date||'9').localeCompare(String(b.date||'9'))||String(a.time||'').localeCompare(String(b.time||''));
  for(const r of lgRounds){
    if(f.r!=='all'&&f.r!=='r'+r)continue;
    const gs=c.games.filter(g=>g.phase==='liga'&&g.round===r&&mine(g)).sort(sorter);if(!gs.length)continue;
    out+=`<div class="card"><div class="th">Rodada ${r}</div>${gs.map(g=>gameRow(c,g)).join('')}</div>`;
  }
  for(let r=0;r<R;r++){
    if(f.r!=='all'&&f.r!=='k'+r)continue;
    const gs=c.games.filter(g=>g.phase==='ko'&&g.kr===r&&!g.bye&&mine(g)).sort((a,b)=>a.ks-b.ks);if(!gs.length)continue;
    out+=`<div class="card"><div class="th rd">${koRoundName(R,r)}</div>${gs.map(g=>gameRow(c,g)).join('')}</div>`;
  }
  return`${tools}<div class="filters"><select data-flt="r" aria-label="Fase">${roundOpts}</select><select data-flt="t" aria-label="Time">${teamOpts}</select></div>${out||emptyBlock('Nenhum jogo neste filtro','','')}`;
}

function statsView(c){
  const{T,goals,games,big,most}=totals(c),P=pstats(c);
  if(!games)return emptyBlock('Sem estatísticas ainda','As estatísticas aparecem a partir do primeiro jogo com resultado ou ao vivo. Gols, assistências e cartões são lançados no painel de cada partida.','');
  const pl=T.filter(x=>x.j>0);
  const best=(fn,dir=1)=>[...pl].sort((a,b)=>dir*(fn(b)-fn(a))||b.j-a.j)[0];
  const avg=(n,j)=>(n/j).toFixed(2).replace('.',',');
  const atk=best(x=>x.gp),def=best(x=>x.gc,-1),win=best(x=>x.v),fp=best(x=>x.ama+3*x.ver,-1),bad=best(x=>x.ama+3*x.ver);
  const inv=pl.filter(x=>x.d===0);
  const sc=P.list.filter(x=>x.gol>0).sort((a,b)=>b.gol-a.gol||a.player.localeCompare(b.player,'pt-BR'));
  const as=P.list.filter(x=>x.ast>0).sort((a,b)=>b.ast-a.ast||a.player.localeCompare(b.player,'pt-BR'));
  const cd=P.list.filter(x=>x.ama||x.ver).sort((a,b)=>b.ver-a.ver||b.ama-a.ama||a.player.localeCompare(b.player,'pt-BR'));
  const hatSet=new Set(P.hat.map(h=>h.player.toLowerCase()+'|'+h.team));
  const card=(label,val,sub,id)=>`<div class="kpi"><small>${label}</small><b>${val}</b><span>${sub||''}</span>${id?`<div class="who">${who(c,id)}</div>`:''}</div>`;
  const placar=x=>x?`${esc((tmById(c,x.h)||{}).name||'?')} ${x.hs} × ${x.as} ${esc((tmById(c,x.a)||{}).name||'?')}`:'—';
  const kpis=`<div class="kpis">
    ${card('Gols',goals,`${avg(goals,games)} por jogo · ${games} jogos`)}
    ${atk?card('Melhor ataque',atk.gp,`${avg(atk.gp,atk.j)} por jogo`,atk.id):''}
    ${def?card('Melhor defesa',def.gc,`${avg(def.gc,def.j)} sofridos por jogo`,def.id):''}
    ${win&&win.v?card('Mais vitórias',win.v,`em ${win.j} jogos`,win.id):''}
    ${big&&big.diff>0?card('Maior goleada',`${big.hs} × ${big.as}`,placar(big)):''}
    ${most&&most.tot>0?card('Jogo com mais gols',most.tot,placar(most)):''}
    ${fp?card('Fair play',fp.ama+3*fp.ver+' pts',`${fp.ama} amarelos, ${fp.ver} vermelhos`,fp.id):''}
    ${bad&&bad.ama+bad.ver>0?card('Mais cartões',bad.ama+bad.ver,`${bad.ama} amarelos, ${bad.ver} vermelhos`,bad.id):''}
    ${inv.length?card('Invictos',inv.length,inv.map(x=>esc((tmById(c,x.id)||{}).name)).join(', ')):''}
  </div>`;
  const tr=id=>`<div class="tn">${badge(tmById(c,id),'sm')}<span class="nm">${esc((tmById(c,id)||{}).name||'')}</span></div>`;
  const art=sc.length?`<table><thead><tr><th>#</th><th class="l">Jogador</th><th class="l hm">Time</th><th>Gols</th></tr></thead><tbody>${sc.slice(0,15).map((x,i)=>`<tr><td class="pos">${i+1}</td><td class="l"><b>${esc(x.player)}</b>${hatSet.has(x.player.toLowerCase()+'|'+x.team)?'<span class="ht">HAT-TRICK</span>':''}</td><td class="l hm">${tr(x.team)}</td><td class="pts">${x.gol}</td></tr>`).join('')}</tbody></table>`:`<div class="pad meta" style="text-align:center">Ainda sem gols com autor lançado.</div>`;
  const ast=as.length?`<table><thead><tr><th>#</th><th class="l">Jogador</th><th class="l hm">Time</th><th>Assist.</th></tr></thead><tbody>${as.slice(0,15).map((x,i)=>`<tr><td class="pos">${i+1}</td><td class="l"><b>${esc(x.player)}</b></td><td class="l hm">${tr(x.team)}</td><td class="pts">${x.ast}</td></tr>`).join('')}</tbody></table>`:`<div class="pad meta" style="text-align:center">Nenhuma assistência lançada. No painel da partida, ative "Perguntar assistência".</div>`;
  const cds=cd.length?`<table><thead><tr><th class="l">Jogador</th><th class="l hm">Time</th><th><span class="cd"></span></th><th><span class="cd r"></span></th></tr></thead><tbody>${cd.slice(0,15).map(x=>`<tr><td class="l"><b>${esc(x.player)}</b></td><td class="l hm">${tr(x.team)}</td><td>${x.ama||'-'}</td><td>${x.ver||'-'}</td></tr>`).join('')}</tbody></table>`:`<div class="pad meta" style="text-align:center">Nenhum cartão lançado.</div>`;
  const cmp=[...pl].sort((a,b)=>b.gp-a.gp||a.gc-b.gc).map(x=>`<tr><td class="l"><div class="tn">${badge(tmById(c,x.id),'sm')}<span class="nm">${esc((tmById(c,x.id)||{}).name)}</span></div></td><td>${x.j}</td><td>${x.v}</td><td>${x.e}</td><td>${x.d}</td><td>${x.gp}</td><td>${x.gc}</td><td>${avg(x.gp,x.j)}</td><td class="hm">${avg(x.gc,x.j)}</td></tr>`).join('');
  return`${kpis}<div class="two"><div class="card"><div class="th">Artilharia</div>${art}</div><div class="card"><div class="th">Assistências</div>${ast}</div></div><div class="two"><div class="card"><div class="th rd">Cartões</div>${cds}</div><div class="card"><div class="th yl">Ataque e defesa</div><div style="overflow-x:auto"><table><thead><tr><th class="l">Time</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>GP/J</th><th class="hm">GC/J</th></tr></thead><tbody>${cmp}</tbody></table></div></div></div>`;
}

// ============ TRANSMISSÃO (aba + overlays OBS) ============
function autoGame(c,pref){
  const real=c.games.filter(g=>!g.bye&&gTeams(c,g).every(Boolean));
  const live=real.find(g=>g.live&&!g.played);
  if(live)return live;
  const key=g=>(g.date||'9999')+(g.time||'');
  const next=real.filter(g=>!g.played).sort((a,b)=>key(a).localeCompare(key(b))||(a.round||0)-(b.round||0))[0];
  const last=[...real.filter(g=>g.played)].sort((a,b)=>key(b).localeCompare(key(a)))[0];
  return pref==='next'?(next||last||null):(last||next||null);
}
function tvLink(c,kind,arg){return location.href.split('#')[0]+'#tv-'+c.id+'-'+kind+(arg!==undefined&&arg!==''?'-'+arg:'')}
function ovStatus(g){
  if(g.played)return{t:'Encerrado',y:true};
  if(g.live)return{t:'Ao vivo',y:false};
  return{t:(fmtDate(g)||'Em breve'),y:true};
}
function overlayHtml(c,kind,arg){
  if(kind==='placar'||kind==='versus'){
    const g=(arg&&c.games.find(x=>x.id===arg))||autoGame(c,kind==='versus'?'next':'last');
    if(!g)return`<div class="o-card o-vs"><div class="oh">Sem jogo</div></div>`;
    const[h,a]=gTeams(c,g),th=tmById(c,h),ta=tmById(c,a),code=t=>t?esc((t.short||t.name.slice(0,3)).toUpperCase()):'—';
    const ph=g.phase==='ko'?koTitle(c,g):(`Rodada ${g.round}`+(c.format==='grupos'&&g.group?` · Grupo ${g.group}`:''));
    if(kind==='placar'){
      const s=ovStatus(g),show=counted(g);
      return`<div class="o-placar"><div class="o-row"><div class="o-team">${badge(th)}<span>${code(th)}</span></div><div class="o-score"><span>${show?(g.hs??0):'-'}</span><i>×</i><span>${show?(g.as??0):'-'}</span></div><div class="o-team r"><span>${code(ta)}</span>${badge(ta)}</div></div><div class="o-foot ${s.y?'y':''}">${esc(s.t)}</div></div>`;
    }
    const rec=t=>{if(!t||g.phase==='ko'||c.format==='mata')return'';const rows=standings(c,t.group||'');const i=rows.findIndex(r=>r.id===t.id);return i<0?'':`${i+1}º · ${rows[i].p} pts`};
    return`<div class="o-card o-vs"><div class="oh">${esc(ph)}</div><div class="vb"><div class="vt">${badge(th,'xl')}<b>${esc(th?th.name:'A definir')}</b><small>${rec(th)}</small></div><div class="vx">×</div><div class="vt">${badge(ta,'xl')}<b>${esc(ta?ta.name:'A definir')}</b><small>${rec(ta)}</small></div></div><div class="vf">${esc([fmtDate(g),g.venue].filter(Boolean).join(' · ')||'Em breve')}</div></div>`;
  }
  if(kind==='tabela'){
    const gr=c.format==='grupos'?(arg&&c.groups.includes(arg)?arg:c.groups[0]):'';
    const rows=standings(c,gr),adv=c.format==='mata'?0:(c.advance||0);
    return`<div class="o-card o-tbl"><div class="oh">${c.format==='grupos'?'Grupo '+esc(gr):esc(c.name)}</div><div class="ob"><table>${tableHead(false)}<tbody>${tableRows(c,rows,adv,false)}</tbody></table></div></div>`;
  }
  if(kind==='artilharia'){
    const sc=pstats(c).list.filter(x=>x.gol>0).sort((a,b)=>b.gol-a.gol||a.player.localeCompare(b.player,'pt-BR')).slice(0,5);
    return`<div class="o-card o-list"><div class="oh">Artilharia</div><div class="ob">${sc.length?sc.map(x=>`<div class="li">${badge(tmById(c,x.team),'sm')}<span class="n">${esc(x.player)}</span><span class="g">${x.gol}</span></div>`).join(''):'<div class="li"><span class="n">Sem gols ainda</span></div>'}</div></div>`;
  }
  if(kind==='jogos'){
    const lg=c.games.filter(g=>g.phase==='liga'&&!g.bye);
    let r=num(arg);
    if(r==null){const nx=lg.filter(g=>!g.played).sort((a,b)=>(a.round||0)-(b.round||0))[0];r=nx?nx.round:(lg.length?Math.max(...lg.map(g=>g.round||1)):1)}
    let gs=lg.filter(g=>g.round===r);
    let title=`Rodada ${r}`;
    if(!gs.length){const R=koRounds(c);if(R){const nx=koList(c).filter(g=>!g.bye&&!g.played&&gTeams(c,g).every(Boolean)).sort((a,b)=>a.kr-b.kr)[0]||koList(c).filter(g=>!g.bye).sort((a,b)=>b.kr-a.kr)[0];if(nx){gs=koList(c).filter(g=>g.kr===nx.kr&&!g.bye);title=koRoundName(R,nx.kr)}}}
    return`<div class="o-card o-games"><div class="oh">${esc(title)}</div><div class="ob">${gs.map(g=>{const[h,a]=gTeams(c,g),th=tmById(c,h),ta=tmById(c,a),show=counted(g);const code=t=>t?esc((t.short||t.name.slice(0,3)).toUpperCase()):'?';return`<div class="gr"><div class="a">${badge(th,'sm')}<span>${code(th)}</span></div><div class="s">${show?`${g.hs??0} × ${g.as??0}`:esc(g.time||'vs')}</div><div class="a r"><span>${code(ta)}</span>${badge(ta,'sm')}</div></div>`}).join('')||'<div class="gr"><span>Sem jogos</span></div>'}</div></div>`;
  }
  if(kind==='campeao'){
    const t=tmById(c,champion(c));
    return`<div class="o-card o-champ"><div class="t">CAMPEÃO</div>${t?badge(t,'xl'):''}<b>${t?esc(t.name):'A definir'}</b></div>`;
  }
  return'';
}
function tvTab(c){

  const opts=games.map(g=>{const[h,a]=gTeams(c,g);return`<option value="${esc(g.id)}" ${(S.tvGame||(live&&live.id))===g.id?'selected':''}>${esc((tmById(c,h)||{}).name)} × ${esc((tmById(c,a)||{}).name)}${g.live&&!g.played?' (ao vivo)':''}</option>`}).join('');
  const gid=S.tvGame||(live&&live.id)||'';

  const items=[

    ['placar','Placar de um jogo específico','Fixo no jogo escolhido acima.',gid],

  const note=`<div class="warn"><b>Como usar no OBS:</b> em <b>Fontes → + → Navegador</b>, cole o link do overlay, defina largura <b>1280</b> e altura <b>720</b> e apague o CSS personalizado. O fundo é transparente e os dados atualizam sozinhos, sem precisar login.</div>`;
  const sel=games.length?`<div class="filters"><select data-tvgame aria-label="Jogo">${opts}</select></div>`:'';
  return`${note}${sel}<div class="tvg">${items.filter(([k])=>k!=='placar'||true).map(([k,t,d,arg])=>{

  }).join('')}</div>`;
}

// ============ LOGOS (upload com redução automática) ============
function readLogo(file,max=160){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type))return rej(new Error('Escolha uma imagem (PNG, JPG ou WebP).'));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Não consegui ler o arquivo.'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('Imagem inválida.'));
      img.onload=()=>{
        try{
          let s=max,out='';
          for(let t=0;t<5;t++){
            const k=Math.min(1,s/Math.max(img.width,img.height)),cv=document.createElement('canvas');
            cv.width=Math.max(1,Math.round(img.width*k));cv.height=Math.max(1,Math.round(img.height*k));
            cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
            out=cv.toDataURL('image/webp',0.88);
            if(!/^data:image\/webp/.test(out))out=cv.toDataURL('image/png');
            if(out.length<45000)break;
            s=Math.round(s*0.75);
          }
          if(!safeImg(out))return rej(new Error('Formato de imagem não suportado.'));
          res(out);
        }catch(e){rej(new Error('Não consegui processar essa imagem.'))}
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function logoField(initial,txt){
  return`<div class="lgup"><span id="lgprev">${logoBadge(initial,'xl',txt)}</span><div><label class="btn ghost sm filebtn">Escolher imagem<input type="file" accept="image/*" id="lgfile"></label> <button type="button" class="btn danger sm" id="lgrm">Remover</button><div class="hint" style="margin:6px 0 0">PNG com fundo transparente fica melhor. A imagem é reduzida automaticamente.</div></div></div>`;
}
function wireLogo(f,initial,txt){
  const st={val:initial};
  const prev=f.querySelector('#lgprev');
  f.querySelector('#lgfile').addEventListener('change',async e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    try{st.val=await readLogo(file);prev.innerHTML=logoBadge(st.val,'xl',txt)}
    catch(er){const eb=$('#err');if(eb)eb.textContent=er.message}
    e.target.value='';
  });
  f.querySelector('#lgrm').addEventListener('click',()=>{st.val='';prev.innerHTML=logoBadge('','xl',txt)});
  return st;
}

function tbModal(){
  const c=cur();
  const order=[...(c.tiebreak||TB_DEFAULT)].filter(k=>TB[k]);
  let all=[...order,...Object.keys(TB).filter(k=>!order.includes(k))],on=new Set(order);
  const body=`<p class="hint" style="margin-top:0">Pontos sempre vêm primeiro. Em caso de empate, o sistema aplica os critérios marcados, de cima para baixo, até desempatar. Se ainda sobrar empate, vale a ordem manual do time (campo no cadastro) e depois a ordem alfabética.</p><div class="g2" style="gap:8px;margin-bottom:10px"><button type="button" class="btn ghost sm" data-pre="def">Padrão (vitórias, saldo, gols)</button><button type="button" class="btn ghost sm" data-pre="h2h">Confronto direto primeiro</button></div><div id="tbbox"></div>`;
  const f=formModal('Critérios de desempate',body,'Salvar',()=>{c.tiebreak=all.filter(k=>on.has(k));commit(c)});
  const box=f.querySelector('#tbbox');
  const draw=()=>{box.innerHTML=all.map((k,i)=>`<div class="tbr ${on.has(k)?'':'off'}"><label class="chk"><input type="checkbox" data-k="${k}" ${on.has(k)?'checked':''}>${on.has(k)?`<b style="color:var(--blue)">${[...all].filter(x=>on.has(x)).indexOf(k)+1}º</b>`:''} ${esc(TB[k])}</label><span><button type="button" data-mv="-1" data-i="${i}" aria-label="Subir">↑</button> <button type="button" data-mv="1" data-i="${i}" aria-label="Descer">↓</button></span></div>`).join('')};
  f.addEventListener('click',e=>{
    const b=e.target.closest('[data-mv]');
    if(b){const i=+b.dataset.i,j=i+(+b.dataset.mv);if(j>=0&&j<all.length){[all[i],all[j]]=[all[j],all[i]];draw()}return}
    const p=e.target.closest('[data-pre]');
    if(p){const pre=p.dataset.pre==='def'?['v','sg','gp']:['h2h','h2hsg','v','sg','gp'];all=[...pre,...Object.keys(TB).filter(k=>!pre.includes(k))];on=new Set(pre);draw()}
  });
  f.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){e.target.checked?on.add(k):on.delete(k);draw()}});
  draw();
}

function viewGame(id){
  const c=cur(),g=c.games.find(x=>x.id===id);if(!g)return;
  const[h,a]=gTeams(c,g),th=tmById(c,h),ta=tmById(c,a),show=counted(g);
  const ev=[...(g.events||[])].sort((x,y)=>(x.min??999)-(y.min??999));
  const lab={gol:'Gol',gc:'Gol contra',ama:'Cartão amarelo',ver:'Cartão vermelho'};
  const meta=[g.phase==='ko'?koTitle(c,g):`Rodada ${g.round}${g.group&&c.format==='grupos'?' · Grupo '+g.group:''}`,fmtDate(g),g.venue].filter(Boolean).map(esc).join(' · ');
  const pens=(g.played&&g.hs===g.as&&g.ph!=null&&g.pa!=null)?`<div class="meta" style="margin-top:6px">Pênaltis: ${g.ph} × ${g.pa}</div>`:'';
  infoModal('Partida',`<div class="vh"><div class="meta" style="margin-bottom:10px">${meta}${g.live&&!g.played?' <span class="live">Ao vivo</span>':''}</div><div class="row"><div style="text-align:center">${badge(th,'lg')}<div class="nm">${esc(th?th.name:'A definir')}</div></div><div class="sc ${show?(g.live&&!g.played?'lv':''):'pend'}">${show?`${g.hs??0}<i>×</i>${g.as??0}`:(g.time||'vs')}</div><div style="text-align:center">${badge(ta,'lg')}<div class="nm">${esc(ta?ta.name:(g.bye?'Folga':'A definir'))}</div></div></div>${pens}</div>${ev.length?`<ul class="tl">${ev.map(e=>{const t=tmById(c,e.team);return`<li><span class="mn">${e.min!=null?e.min+"'":''}</span><span class="pill">${lab[e.type]}</span><b>${esc(e.player||'(sem autor)')}</b>${e.ast?`<span class="meta">ass. ${esc(e.ast)}</span>`:''}<span class="meta">${esc(t?t.name:'')}</span></li>`}).join('')}</ul>`:'<p class="meta" style="text-align:center">Sem lances registrados.</p>'}`,S.canEdit&&S.edit?`<button class="btn sm" data-act="game" data-id="${esc(g.id)}">Abrir painel</button>`:'');
}

function koModal(){
  const c=cur();
  if(c.teams.length<2){toast('Cadastre pelo menos 2 times.');return}
  const hasKo=koRounds(c)>0;
  const def=c.format==='grupos'?(c.advance||2):c.format==='liga'?(c.advance||4):c.teams.length;
  const max=c.format==='grupos'?Math.max(1,...c.groups.map(g=>teamsOf(c,g).length)):c.teams.length;
  const lbl=c.format==='grupos'?'Classificados por grupo':'Quantos times entram';
  const body=`${hasKo?'<div class="warn">Já existe um chaveamento. Gerar um novo <b>apaga o atual</b>, com resultados.</div>':''}
  ${c.format==='grupos'?'<div class="warn">Confira se a fase de grupos terminou: os classificados saem da tabela atual.</div>':''}
  <div class="g2"><label>${lbl}<input name="q" type="number" min="${c.format==='grupos'?1:2}" max="${max}" value="${Math.min(def,max)}"></label><label class="chk" style="margin-top:22px"><input type="checkbox" name="shuf" ${c.format==='mata'?'checked':''}> Sortear confrontos</label></div>
  <div class="sep">Cabeças de chave</div><div id="seedprev" class="meta"></div>
  <p class="hint">Com número de times que não é potência de 2, os melhores colocados avançam direto na 1ª fase (folga). Você pode ajustar os confrontos da 1ª fase depois.</p>`;
  const f=formModal('Gerar chaveamento',body,'Gerar',fd=>{
    const q=num(fd.get('q'))||2,ids=seedList(c,q,!!fd.get('shuf'));
    if(ids.length<2)return'São necessários pelo menos 2 times classificados.';
    genBracket(c,ids);commit(c);go(c.id,'mata');
  });
  const prev=()=>{
    const q=num(f.querySelector('[name=q]').value)||2,shuf=f.querySelector('[name=shuf]').checked,ids=seedList(c,q,false);
    f.querySelector('#seedprev').innerHTML=(shuf?'<i>A ordem será sorteada ao gerar.</i> ':'')+ids.map((id,i)=>`${i+1}º ${esc((tmById(c,id)||{}).name)}`).join(' · ');
  };
  f.querySelector('[name=q]').addEventListener('input',prev);f.querySelector('[name=shuf]').addEventListener('change',prev);prev();
}
function exportModal(){
  const c=cur();
  infoModal('Backup do campeonato',`<p class="hint">Copie o texto abaixo e guarde onde quiser. Para restaurar, use <b>Importar backup</b> na tela inicial.</p><textarea class="mono" id="bk" readonly>${esc(JSON.stringify(c))}</textarea>`,`<button class="btn sm" data-act="copyBk">Copiar</button>`);
}
function importModal(){
  formModal('Importar backup','<p class="hint">Cole aqui o texto de um backup. Ele entra como um novo campeonato, sem sobrescrever os atuais.</p><textarea class="mono" name="json" required></textarea>','Importar',fd=>{
    let o;try{o=JSON.parse(fd.get('json'))}catch(e){return'Esse texto não é um backup válido.'}
    if(!o||typeof o.name!=='string'||!Array.isArray(o.teams)||!Array.isArray(o.games)||!FORMATS[o.format])return'Backup incompleto ou de outro tipo.';
    o.id=uid();o.name=o.name+' (importado)';o.updatedAt=Date.now();
    o.pts=o.pts||{w:3,d:1,l:0};o.groups=Array.isArray(o.groups)?o.groups:[];
    S.champs[o.id]=o;commit(o);go(o.id,null);
  });
}
function loginModal(){
  formModal('Entrar','<p class="hint">Acesso da equipe de transmissão. Se ainda não tem usuário, peça a quem administra o site.</p><label>E-mail<input name="email" type="email" required autocomplete="username"></label><label>Senha<input name="pw" type="password" required autocomplete="current-password"></label>','Entrar',fd=>{
    const email=(fd.get('email')||'').trim(),password=fd.get('pw')||'';
    sb.auth.signInWithPassword({email,password}).then(r=>{
      if(r.error){const e=$('#err');if(e)e.textContent='Não consegui entrar: '+(r.error.message||'confira e-mail e senha')+'.'}
      else{closeModal();toast('Conectado.')}
    }).catch(()=>{const e=$('#err');if(e)e.textContent='Não consegui entrar agora. Tente de novo.'});
    return'Verificando…';
  });
}
function dupChamp(){
  const c=cur(),n=JSON.parse(JSON.stringify(c));
  n.teams.forEach(t=>{t.id=uid('t')});
  Object.assign(n,{id:uid(),name:c.name+' (cópia)',games:[],createdAt:Date.now(),updatedAt:Date.now()});
  S.champs[n.id]=n;commit(n);go(n.id,'times');toast('Cópia criada com os times, sem jogos.');
}

// ============ AÇÕES ============
const actions={
  home:()=>go(null),
  open:d=>go(d.id,null),
  tab:d=>{S.route.tab=d.tab;try{location.hash='c-'+S.route.id+'-'+d.tab}catch(e){}render()},
  toggleEdit:()=>{S.edit=!S.edit;render()},
  login:loginModal,
  logout:async()=>{try{await sb.auth.signOut()}catch(e){}S.edit=false;toast('Você saiu.')},
  close:closeModal,
  pClose:closeModal,
  doConfirm:()=>{const f=S.fn;S.fn=null;closeModal();if(f)f()},
  newChamp:()=>champModal(),
  editChamp:()=>champModal(S.route.id),
  dupChamp,
  exportChamp:exportModal,
  import:importModal,
  tbModal,
  copyBk:()=>copyText($('#bk').value,$('#bk')),
  copyUrl:(d)=>copyText(d.url),
  delChamp:()=>{const c=cur();confirmModal(`Excluir "${c.name}" com todos os times e jogos? Não dá para desfazer.`,'Excluir',()=>{S.deleting[c.id]=true;delete S.champs[c.id];queueSave(c.id);go(null)})},
  newTeam:()=>teamModal(),
  editTeam:d=>teamModal(d.id),
  delTeam:d=>{const c=cur(),t=tmById(c,d.id);confirmModal(`Excluir "${t.name}"? Os jogos da fase de pontos/grupos desse time também serão removidos.`,'Excluir',()=>{
    c.teams=c.teams.filter(x=>x.id!==t.id);
    c.games=c.games.filter(g=>!(g.phase==='liga'&&(g.home===t.id||g.away===t.id)));
    c.games.forEach(g=>{if(g.phase==='ko'){if(g.home===t.id)g.home=null;if(g.away===t.id)g.away=null;if(g.kr===0)g.bye=!g.away&&!!g.home}});
    commit(c)})},
  newGame:()=>{if(cur().teams.length<2)return toast('Cadastre pelo menos 2 times.');gameModal()},
  game:d=>ED()?openPanel(d.id):viewGame(d.id),
  delGame:d=>{const c=cur();confirmModal('Excluir este jogo?','Excluir',()=>{c.games=c.games.filter(g=>g.id!==d.id);commit(c)})},
  genFix:()=>{
    const c=cur();
    if(c.teams.length<2)return toast('Cadastre pelo menos 2 times.');
    const run=()=>{const n=genFixtures(c);commit(c);toast(n?`${n} jogos gerados. Toque em cada jogo para definir data e horário.`:'Nenhum jogo gerado: cada grupo precisa de pelo menos 2 times.')};
    const ex=c.games.filter(g=>g.phase==='liga').length;
    if(ex)confirmModal(`Gerar a tabela substitui os ${ex} jogos atuais da fase de pontos/grupos, incluindo resultados. Continuar?`,'Substituir',run);else run();
  },
  genKo:koModal,
  sim:d=>{S.sim[d.id]=S.sim[d.id]===d.v?undefined:d.v;if(!S.sim[d.id])delete S.sim[d.id];render()},
  simClear:()=>{S.sim={};render()},
  // painel da partida
  pAct:d=>{S.panel.step='pick';S.panel.side=d.side;S.panel.kind=d.kind;S.panel.scorer=undefined;refreshPanel()},
  pCancel:()=>{S.panel.step=null;S.panel.scorer=undefined;refreshPanel()},
  pPick:d=>{const{c,g}=panelGame(),[h,a]=gTeams(c,g),t=tmById(c,S.panel.side==='h'?h:a);panelChoose((t.players||[])[+d.i]||'')},
  pNone:()=>panelChoose(''),
  pCustom:()=>{const v=(($('#pcustom')||{}).value||'').trim();if(!v)return toast('Digite o nome do jogador.');panelChoose(v)},
  pAst:d=>{const{c,g}=panelGame(),[h,a]=gTeams(c,g),t=tmById(c,S.panel.side==='h'?h:a);panelAdd('gol',S.panel.side,S.panel.scorer,(t.players||[])[+d.i]||'')},
  pNoAst:()=>panelAdd('gol',S.panel.side,S.panel.scorer,''),
  pRm:d=>{const{c,g}=panelGame();if(g&&removeEvent(c,g,d.id))commit(c)},
  pPlus:d=>{const{c,g}=panelGame();if(!g)return;const[h,a]=gTeams(c,g);addEvent(c,g,{type:'gol',team:d.side==='h'?h:a,player:'',min:num($('#pmin')&&$('#pmin').value)});commit(c)},
  pMinus:d=>{const{c,g}=panelGame();if(g&&minusGoal(c,g,d.side))commit(c)},
  pStart:()=>{const{c,g}=panelGame();g.live=true;g.played=false;if(g.hs==null)g.hs=0;if(g.as==null)g.as=0;commit(c)},
  pEnd:()=>{const{c,g}=panelGame();g.played=true;g.live=false;if(g.hs==null)g.hs=0;if(g.as==null)g.as=0;if(g.phase==='ko'&&g.hs===g.as&&g.ph==null)toast('Empate no mata-mata: informe os pênaltis para definir quem avança.');commit(c)},
  pReopen:()=>{const{c,g}=panelGame();g.played=false;g.live=true;commit(c)},
  pPen:d=>{const{c,g}=panelGame(),k=d.side==='h'?'ph':'pa';g[k]=Math.max(0,(g[k]||0)+(+d.d));commit(c)},
  pEditData:()=>{const id=S.panel.id;closeModal();gameModal(id)},
};
function copyText(txt,ta){
  const done=()=>toast('Copiado!');
  const fb=()=>{try{const t=ta||Object.assign(document.createElement('textarea'),{value:txt});if(!ta){document.body.appendChild(t)}t.select();const ok=document.execCommand('copy');if(!ta)t.remove();ok?done():toast('Selecione o texto e copie manualmente.')}catch(e){toast('Selecione o texto e copie manualmente.')}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(fb);else fb();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='ovclick'){if(e.target===el)closeModal();return}
  if(actions[a]){e.preventDefault();actions[a](el.dataset,el)}
});
document.addEventListener('change',e=>{
  const d=e.target.dataset||{};
  if(d.flt){S.flt[d.flt]=e.target.value;render()}
  else if(d.chg==='askAst'){S.askAst=e.target.checked}
  else if('tvgame' in d){S.tvGame=e.target.value;render()}
});
document.addEventListener('input',e=>{
  if(e.target.dataset&&'pmin' in e.target.dataset)S.lastMin=e.target.value;
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&e.target&&e.target.id==='pcustom'){e.preventDefault();actions.pCustom()}
});
window.addEventListener('hashchange',()=>{const o=JSON.stringify([S.route,S.tv]);parseHash();if(JSON.stringify([S.route,S.tv])!==o)render()});

parseHash();renderTop();initStore();
</script>
