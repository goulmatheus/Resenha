function tableRows(c,rows,adv,withForm,ex,kp){
  return rows.map((r,i)=>{
    const t=tmById(c,r.id);
    return`<tr class="${adv&&i<adv?'q':(ex&&ex.ids.has(r.id)?'q3':'')}"${kp!=null?` data-k="${esc(kp)}|${esc(r.id)}"`:''}><td class="pos">${i+1}</td><td class="l"><div class="tn">${badge(t,'sm')}<span class="nm">${esc(t.name)}</span></div></td><td class="pts">${r.p}</td><td>${r.j}</td><td>${r.v}</td><td>${r.e}</td><td>${r.d}</td><td class="hm">${r.gp}</td><td class="hm">${r.gc}</td><td>${r.sg>0?'+':''}${r.sg}</td><td class="hm">${r.apr}%</td>${withForm?`<td class="hm"><span class="form">${r.form.map(f=>`<i class="${f}">${f}</i>`).join('')}</span></td>`:''}</tr>`;
  }).join('');
}
const tableHead=withForm=>`<thead><tr><th>#</th><th class="l">Time</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th class="hm">GP</th><th class="hm">GC</th><th>SG</th><th class="hm">%</th>${withForm?'<th class="hm">Últimos</th>':''}</tr></thead>`;

function groupsOf(c){return c.format==='grupos'?[...c.groups,...(c.teams.some(t=>!t.group||!c.groups.includes(t.group))?['']:[])]:['']}

function tabelaView(c){
  if(c.teams.length<2)return emptyBlock('Cadastre os times','A classificação aparece quando houver pelo menos dois times e jogos com resultado.',ED()?`<button class="btn" data-act="newTeam">+ Adicionar time</button>`:'');
  const adv=c.advance||0,ex=extraList(c);
  const anyLive=c.games.some(g=>g.live&&!g.played&&g.phase==='liga');
  const tools=ED()?`<div class="tools"><button class="btn ghost sm" data-act="tbModal">Critérios de desempate</button></div>`:'';
  const blocks=groupsOf(c).map(gr=>{
    const rows=standings(c,gr);if(!rows.length)return'';
    const head=c.format==='grupos'?(gr?`Grupo ${esc(gr)}`:'Sem grupo'):'Classificação';
    const q=gr===''&&c.format==='grupos'?0:adv;
    return`<div class="card"><div class="th">${head}<small>${rows.length} times${anyLive?' · inclui jogos ao vivo':''}</small></div><div style="overflow-x:auto"><table>${tableHead(true)}<tbody>${tableRows(c,rows,q,true,gr===''?null:ex,'tb'+gr)}</tbody></table></div><div class="legend">${q?`<span><i></i>${c.format==='grupos'?`Classificam-se ${q} por grupo`:`Top ${q} avançam ao mata-mata`}</span>`:''}${ex.n&&gr!==''?`<span><i style="border-left-color:var(--yellow)"></i>${ex.n} melhor${ex.n>1?'es':''} ${ex.pos}º colocado${ex.n>1?'s':''} também avança${ex.n>1?'m':''}</span>`:''}<span>Desempate: ${esc(critText(c))}</span></div></div>`;
  }).join('');
  return tools+(blocks||emptyBlock('Sem dados','Adicione times aos grupos.',''))+extraCard(c,ex);
}
function extraCard(c,ex){
  if(!ex.n||!ex.ranked.length)return'';
  const rows=ex.ranked.map((r,i)=>{const t=tmById(c,r.id);return`<tr class="${i<ex.n?'q3':''}"><td class="pos">${i+1}</td><td class="l"><div class="tn">${badge(t,'sm')}<span class="nm">${esc(t.name)}</span></div></td><td>${esc(r.group)}</td><td class="pts">${r.p}</td><td>${r.j}</td><td>${r.v}</td><td class="hm">${r.gp}</td><td class="hm">${r.gc}</td><td>${r.sg>0?'+':''}${r.sg}</td></tr>`}).join('');
  return`<div class="card"><div class="th yl">Melhores ${ex.pos}º colocados<small style="color:#333">${ex.n} vaga${ex.n>1?'s':''} · compara os grupos</small></div><div style="overflow-x:auto"><table><thead><tr><th>#</th><th class="l">Time</th><th>Gr.</th><th>P</th><th>J</th><th>V</th><th class="hm">GP</th><th class="hm">GC</th><th>SG</th></tr></thead><tbody>${rows}</tbody></table></div><div class="legend"><span><i style="border-left-color:var(--yellow)"></i>Classificados como melhores ${ex.pos}º colocados</span><span>Critério: pontos e depois ${esc(critText(c).split(' › ').slice(1,-1).filter(x=>!/Confronto/.test(x)).join(' › ')||'ordem alfabética')}</span></div></div>`;
}

function cenariosView(c){
  const adv=c.advance||0;
  if(c.teams.length<2||!adv)return emptyBlock('Sem cenários','Cadastre os times e defina quantos se classificam nos ajustes do campeonato.','');
  const note=`<p class="hint" style="margin:0 0 12px">As porcentagens consideram todas as combinações possíveis de vitória, empate e derrota nos jogos que faltam, contando só os <b>pontos</b>.${c.extra?` Os melhores ${(c.advance||0)+1}º colocados dependem dos outros grupos e não entram nesta análise.`:''} A faixa listrada mostra onde o desempate decide.</p>`;
  const out=groupsOf(c).filter(gr=>gr!==''||c.format!=='grupos').map(gr=>{
    const sc=scenarioCalc(c,gr),rows=sc.rows;if(!rows.length)return'';
    const head=c.format==='grupos'?`Grupo ${esc(gr)}`:'Classificação';
    const inSet=new Set(rows.map(r=>r.id));
    const rem=c.games.filter(g=>g.phase==='liga'&&!counted(g)&&inSet.has(g.home)&&inSet.has(g.away)).sort((a,b)=>(a.round||0)-(b.round||0));
    let tbl;
    if(sc.many)tbl=`<div class="pad meta">Faltam ${sc.rem} jogos neste grupo. A análise automática aparece quando restarem 10 ou menos. Enquanto isso, use o simulador abaixo.</div>`;
    else{
      // "corrida": pontos atuais → máximo possível, numa escala comum, com a chance ao lado
      const maxAll=Math.max(1,...sc.list.map(o=>o.max));
      const pc=v=>(v/maxAll*100).toFixed(2)+'%';
      tbl=`<div class="race"><div class="race-h"><span>#</span><span>Time</span><span>Pontos agora → máximo possível</span><span>Chance</span></div>${sc.list.map(o=>{
        const t=tmById(c,o.id),st=o.status;
        const cls=st==='classificado'?'ok':st==='eliminado'?(c.extra?'op':'no'):'op';
        const pill=st==='classificado'?'<span class="pill ok">Classificado</span>':st==='eliminado'?(c.extra?`<span class="pill op">Só como melhor ${(c.advance||0)+1}º</span>`:'<span class="pill no">Eliminado</span>'):'<span class="pill op">Na briga</span>';
        const s=Math.round((o.sure||0)*100),p=Math.round((o.poss||0)*100);
        return`<div class="rc ${cls}" data-k="rc|${esc(gr)}|${esc(o.id)}"><span class="rc-pos">${o.pos}</span><div class="rc-team">${badge(t,'sm')}<span class="nm">${esc(t.name)}</span></div><div class="rc-track" title="${esc(t.name)}: ${o.p} pts agora, pode chegar a ${o.max}"><i class="rc-now" data-w style="width:${pc(o.p)}"></i><i class="rc-can" style="left:${pc(o.p)};width:${pc(Math.max(0,o.max-o.p))}"></i><span class="rc-lab"><b>${o.p}</b>${o.max>o.p?` → ${o.max}`:''} pts</span></div><div class="rc-ch"><div class="rc-num"><b>${s}%</b>${p>s?`<small>até ${p}%</small>`:''}</div><div class="bar" title="Garantida: ${s}% · Pode chegar a ${p}%"><i class="s" data-w style="width:${s}%"></i><i class="p" data-w style="width:${Math.max(0,p-s)}%"></i></div>${pill}</div></div>`;
      }).join('')}</div>`;
    }
    let sim='';
    if(rem.length){
      const proj=simStandings(c,gr,S.sim);
      const now=standings(c,gr),posNow=new Map(now.map((x,i)=>[x.id,i+1]));
      const nSim=rem.filter(g=>S.sim[g.id]).length;
      const code=t=>esc((t.short||t.name.slice(0,3)).toUpperCase());
      const projRows=proj.map((x,i)=>{const t=tmById(c,x.id),d=(posNow.get(x.id)||i+1)-(i+1);
        return`<tr class="${adv&&i<adv?'q':''}" data-k="pj|${esc(gr)}|${esc(x.id)}"><td class="pos">${i+1}</td><td class="mv">${nSim&&d?`<span class="${d>0?'up':'dn'}">${d>0?'▲':'▼'}${Math.abs(d)}</span>`:'<span class="eq">–</span>'}</td><td class="l"><div class="tn">${badge(t,'sm')}<span class="nm">${esc(t.name)}</span></div></td><td class="pts">${x.p}</td><td>${x.j}</td><td>${x.v}</td><td>${x.e}</td><td>${x.d}</td><td>${x.sg>0?'+':''}${x.sg}</td></tr>`}).join('');
      sim=`<div class="simhd"><div><b>Simulador</b><small>${nSim} de ${rem.length} jogo${rem.length>1?'s':''} simulado${nSim===1?'':'s'} · toque no vencedor</small><div class="simprog"><i data-w style="width:${(nSim/rem.length*100).toFixed(1)}%"></i></div></div><div class="simbtns"><button class="btn ghost sm" data-act="simFill" data-g="${esc(gr)}" data-v="h">Mandantes vencem</button><button class="btn ghost sm" data-act="simFill" data-g="${esc(gr)}" data-v="d">Tudo empate</button><button class="btn ghost sm" data-act="simFill" data-g="${esc(gr)}" data-v="a">Visitantes vencem</button><button class="btn ghost sm" data-act="simRand" data-g="${esc(gr)}" title="Sorteia um resultado para cada jogo">🎲 Sortear</button>${nSim?`<button class="btn danger sm" data-act="simClear" data-g="${esc(gr)}">Limpar</button>`:''}</div></div>${rem.map(g=>{
        const th=tmById(c,g.home),ta=tmById(c,g.away),v=S.sim[g.id]||'';
        return`<div class="simrow ${v?'set':''}" data-k="sm|${esc(g.id)}"><div class="t r ${v==='h'?'win':v==='a'?'lose':''}"><span>${esc(th.name)}</span>${badge(th,'sm')}</div><div class="opt opt3"><button class="${v==='h'?'on':''}" data-act="sim" data-id="${esc(g.id)}" data-v="h" title="Vitória de ${esc(th.name)}" aria-label="Vitória de ${esc(th.name)}">${code(th)}</button><button class="${v==='d'?'on':''}" data-act="sim" data-id="${esc(g.id)}" data-v="d" aria-label="Empate">Empate</button><button class="${v==='a'?'on':''}" data-act="sim" data-id="${esc(g.id)}" data-v="a" title="Vitória de ${esc(ta.name)}" aria-label="Vitória de ${esc(ta.name)}">${code(ta)}</button></div><div class="t ${v==='a'?'win':v==='h'?'lose':''}">${badge(ta,'sm')}<span>${esc(ta.name)}</span></div></div>`;
      }).join('')}<div class="sep" style="margin:0;padding:10px 16px;background:var(--surf2)">Tabela projetada ${nSim?'<small class="meta" style="text-transform:none;font-family:Barlow,sans-serif;font-weight:500">setas = mudança em relação à tabela atual</small>':''}</div><div style="overflow-x:auto"><table class="proj"><thead><tr><th>#</th><th></th><th class="l">Time</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr></thead><tbody>${projRows}</tbody></table></div><div class="legend"><span>Resultados simulados contam como 1 × 0 / 0 × 0 / 0 × 1. Só para projeção, nada é salvo.</span></div>`;
    }
    return`<div class="card"><div class="th yl">${head}<small style="color:#333">${sc.rem} jogos restantes · ${adv} vaga${adv>1?'s':''}</small></div>${tbl}${sim}</div>`;
  }).join('');
  return astCard(c)+note+(out||emptyBlock('Sem dados','',''));
}


// ---- assistente de cenários ----
function astCard(c){
  const groups=groupsOf(c).filter(gr=>gr!==''||c.format!=='grupos');
  const A=S.ast=S.ast||{kind:'need',grp:null,tid:null,tgt:'top',gid:null,pred:'top'};
  if(!groups.includes(A.grp))A.grp=groups[0];
  const rows=standings(c,A.grp);if(rows.length<2)return'';
  const adv=c.advance||0;
  if(!rows.some(r=>r.id===A.tid))A.tid=rows[0].id;
  if(A.tgt!=='top'&&!(+A.tgt>=1&&+A.tgt<=rows.length))A.tgt='top';
  if(!['top','out'].includes(A.pred)&&!(+A.pred>=1&&+A.pred<=rows.length))A.pred='top';
  const rem=astSetup(c,A.grp).rem;
  if(!rem.some(g=>g.id===A.gid))A.gid=(rem.find(g=>g.home===A.tid||g.away===A.tid)||rem[0]||{}).id||null;
  const T=tmById(c,A.tid),nm=id=>(tmById(c,id)||{}).name||'?';
  const pos=Array.from({length:rows.length},(_,i)=>i+1);
  const opt=(v,l,cur)=>`<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`;
  const fld=(l,k,html)=>`<label>${l}<select data-ast="${k}">${html}</select></label>`;
  let f=fld('Pergunta','kind',opt('need','O que o time precisa para…',A.kind)+opt('margin','Por quantos gols… (resultado de um jogo)',A.kind));
  if(c.format==='grupos')f+=fld('Grupo','grp',groups.map(g=>opt(g,'Grupo '+g,A.grp)).join(''));
  f+=fld('Time','tid',rows.map(r=>opt(r.id,nm(r.id),A.tid)).join(''));
  if(A.kind==='need')f+=fld('Objetivo','tgt',(adv?opt('top',`se classificar (${adv} primeiro${adv>1?'s':''})`,A.tgt):'')+pos.map(p=>opt(p,`ficar em ${p}º`,A.tgt)).join(''));
  else{
    f+=fld('Jogo',  'gid',rem.map(g=>opt(g.id,`${roundLabel(c,g.round)}: ${nm(g.home)} × ${nm(g.away)}`,A.gid)).join(''));
    f+=fld('Quero que o time','pred',(adv?opt('top','se classifique',A.pred)+opt('out','fique fora da classificação',A.pred):'')+pos.map(p=>opt(p,`fique em ${p}º`,A.pred)).join(''));
  }
  let res='';
  const pill=(k,t)=>`<span class="pill ${k}">${t}</span>`;
  if(A.kind==='need'){
    const target=A.tgt==='top'?{mode:'top',n:adv}:{mode:'pos',n:+A.tgt};
    const goal=A.tgt==='top'?'se classificar':`ficar em ${A.tgt}º`;
    const r=needFor(c,A.grp,A.tid,target);
    if(r.many)res=`<div class="ast-sum">Faltam ${r.rem} jogos neste grupo. A resposta automática aparece quando restarem 10 ou menos.</div>`;
    else{
      const sum=`<b>${esc(T.name)}</b> tem <b>${r.me.p} pts</b> e ${r.own.length} jogo${r.own.length===1?'':'s'} a disputar (máximo de ${r.maxPts} pts). Melhor posição possível: <b>${r.best}º</b> · pior: <b>${r.worst}º</b>.${r.minGuarantee!=null?` Garante o objetivo com <b>${r.minGuarantee} pts</b>.`:''}${r.minGuarantee==null&&r.minChance!=null?` Só tem chance com <b>${r.minChance} pts</b> ou mais.`:''}${c.extra&&A.tgt==='top'&&r.worst>adv?` <i>Obs.: a vaga como melhor ${adv+1}º colocado depende dos outros grupos e não entra aqui.</i>`:''}`;
      let lines='';
      if(r.own.length>2)lines=`<div class="meta" style="padding:8px 0">O time tem ${r.own.length} jogos a disputar. O detalhe por resultado aparece quando restarem 2 ou menos.</div>`;
      else lines=r.cases.map(cs=>{
        const lab=r.own.length?r.own.map((g,i)=>{const o=cs.ao[i],home=g.home===A.tid,opp=nm(home?g.away:g.home);const res=home?o:(o===0?2:o===2?0:1);return res===0?`vencer ${esc(opp)}`:res===1?`empatar com ${esc(opp)}`:`perder para ${esc(opp)}`}).join(' e '):'Sem jogos restantes';
        let p,txt;
        if(cs.status==='garantido'){p=pill('ok','Garantido');txt=A.tgt==='top'?'Está dentro em qualquer combinação de resultados.':`Fica em ${A.tgt}º em qualquer combinação de resultados.`}
        else if(cs.status==='impossivel'){p=pill('no','Não alcança');txt=`Não consegue ${goal} desse jeito.`}
        else if(cs.status==='depende'){p=pill('op','Depende');txt=`Garante ${goal} se ${cs.cond.map(q=>esc(condText(c,q))).join(' ou se ')||'outros resultados ajudarem'}. Em ${cs.sure} de ${cs.total} combinações dos outros jogos.`}
        else{p=pill('op','Só no desempate');txt=`Só é possível com o desempate (saldo, gols...)${cs.cond.length?` e se ${cs.cond.map(q=>esc(condText(c,q))).join(' e se ')}`:''}.`}
        return`<div class="ast-line">${p}<div><b>${esc(lab.charAt(0).toUpperCase()+lab.slice(1))}</b><div class="meta">${txt}</div></div></div>`;
      }).join('');
      res=`<div class="ast-sum">${sum}</div>${lines}<div class="meta" style="margin-top:6px">Conta feita pelos pontos de todas as combinações de resultado dos jogos que faltam. O desempate por gols só entra quando indicado.</div>`;
    }
  }else{
    if(!rem.length)res=`<div class="ast-sum">Não há jogos restantes neste grupo.</div>`;
    else{
      const pred=A.pred==='top'?{mode:'top'}:A.pred==='out'?{mode:'out'}:{mode:'pos',n:+A.pred};
      const r=marginFor(c,A.grp,A.gid,A.tid,pred,S.sim);
      if(r.err)res=`<div class="ast-sum">${esc(r.err)}</div>`;
      else if(r.many)res=`<div class="ast-sum">Ainda há ${r.free} outros jogos em aberto. Fixe o resultado de alguns no <b>simulador</b> abaixo (máximo de 5 em aberto) e a resposta aparece aqui.</div>`;
      else{
        const g=r.game,h=nm(g.home),a=nm(g.away);
        const goalT=A.pred==='top'?'se classifique':A.pred==='out'?'fique fora da classificação':`fique em ${A.pred}º`;
        const al=r.res.filter(x=>x.status==='sempre').map(x=>x.m),dp=r.res.filter(x=>x.status==='depende').map(x=>x.m);
        let txt;
        if(al.length)txt=`Para <b>${esc(T.name)}</b> ${goalT}: <b>${marginPhrases(al,esc(h),esc(a),r.LIM).join('; ou ')}</b>.`;
        else txt=`Nenhum resultado de ${esc(h)} × ${esc(a)} garante, sozinho, que ${esc(T.name)} ${goalT}.`;
        if(dp.length)txt+=` ${al.length?'Além disso, pode':'Pode'} acontecer, dependendo dos outros jogos, se: ${marginPhrases(dp,esc(h),esc(a),r.LIM).join('; ou ')}.`;
        if(!al.length&&!dp.length)txt=`Em nenhum resultado de ${esc(h)} × ${esc(a)} o time ${esc(T.name)} consegue isso.`;
        const sit=s=>s==='sempre'?pill('ok','Sim'):s==='nunca'?pill('no','Não'):pill('op','Depende');
        const trs=r.res.filter(x=>Math.abs(x.m)<=5).map(x=>`<tr><td class="l">${x.m>0?`${esc(h)} vence por ${x.m}`:x.m<0?`${esc(a)} vence por ${-x.m}`:'Empate'}</td><td>${x.pmin===x.pmax?x.pmin+'º':x.pmin+'º a '+x.pmax+'º'}</td><td>${sit(x.status)}</td></tr>`).join('');
        res=`<div class="ast-sum">${txt}</div><div style="overflow-x:auto"><table><thead><tr><th class="l">Resultado</th><th>Posição de ${esc(T.name)}</th><th>Atinge?</th></tr></thead><tbody>${trs}</tbody></table></div><div class="meta" style="margin-top:6px">Usa o placar mínimo para cada diferença de gols (ex.: 3 de diferença = 3×0). Nos outros jogos, vale 1×0, 0×0 ou 0×1.${r.fixed?` ${r.fixed} jogo${r.fixed>1?'s':''} fixado${r.fixed>1?'s':''} no simulador.`:''}</div>`;
      }
    }
  }
  return`<div class="card"><div class="th yl">Assistente de cenários<small style="color:#333">cálculo exato, sem chute</small></div><div class="pad"><div class="astf">${f}</div>${res}</div></div>`;
}

function jogosView(c){
  const real=c.games.filter(g=>!g.bye);
  const lgRounds=[...new Set(c.games.filter(g=>g.phase==='liga').map(g=>g.round))].sort((a,b)=>a-b);
  const R=koRounds(c);
  const tools=ED()?`<div class="tools">${c.format!=='mata'?`<button class="btn sm" data-act="genFix">Gerar tabela de jogos</button>`:''}<button class="btn ghost sm" data-act="newGame">+ Novo jogo</button>${lgRounds.length?`<button class="btn ghost sm" data-act="roundsModal">Nomear rodadas</button>`:''}</div>`:'';
  if(!real.length)return tools+emptyBlock('Nenhum jogo cadastrado',c.format==='mata'?'Gere o chaveamento na aba Mata-mata.':'Gere a tabela automaticamente a partir dos times, ou adicione jogos um a um.','');
  const f=S.flt;
  const teamOpts=`<option value="all">Todos os times</option>`+c.teams.map(t=>`<option value="${esc(t.id)}" ${f.t===t.id?'selected':''}>${esc(t.name)}</option>`).join('');
  const roundOpts=`<option value="all">Todas as fases</option>`+lgRounds.map(r=>`<option value="r${r}" ${f.r==='r'+r?'selected':''}>${esc(roundLabel(c,r))}</option>`).join('')+(R?Array.from({length:R},(_,r)=>`<option value="k${r}" ${f.r==='k'+r?'selected':''}>${koRoundName(R,r)}</option>`).join(''):'');
  const mine=g=>f.t==='all'||gTeams(c,g).includes(f.t);
  let out='';
  const sorter=(a,b)=>String(a.date||'9').localeCompare(String(b.date||'9'))||String(a.time||'').localeCompare(String(b.time||''));
  for(const r of lgRounds){
    if(f.r!=='all'&&f.r!=='r'+r)continue;
    const gs=c.games.filter(g=>g.phase==='liga'&&g.round===r&&mine(g)).sort(sorter);if(!gs.length)continue;
    out+=`<div class="card"><div class="th">${esc(roundLabel(c,r))}</div>${gs.map(g=>gameRow(c,g)).join('')}</div>`;
  }
  for(let r=0;r<R;r++){
    if(f.r!=='all'&&f.r!=='k'+r)continue;
    const gs=c.games.filter(g=>g.phase==='ko'&&g.kr===r&&!g.bye&&mine(g)).sort((a,b)=>a.ks-b.ks);if(!gs.length)continue;
    out+=`<div class="card"><div class="th rd">${koRoundName(R,r)}</div>${gs.map(g=>gameRow(c,g)).join('')}</div>`;
  }
  return`${tools}<div class="filters"><select data-flt="r" aria-label="Fase">${roundOpts}</select><select data-flt="t" aria-label="Time">${teamOpts}</select></div>${out||emptyBlock('Nenhum jogo neste filtro','','')}`;
}

function mataView(c){
  const R=koRounds(c);
  const tools=ED()?`<div class="tools"><button class="btn sm" data-act="genKo">${R?'Gerar novo chaveamento':'Gerar chaveamento'}</button></div>`:'';
  if(!R)return tools+emptyBlock('Chaveamento ainda não gerado',c.format==='grupos'?'Quando a fase de grupos terminar, gere o mata-mata com os classificados.':c.format==='liga'?'Use o chaveamento para fases finais após a classificação.':'Cadastre os times e gere o chaveamento.','');
  const ch=tmById(c,champion(c));
  const banner=ch?`<div class="trophy">${badge(ch,'lg')}<div><small>Campeão</small><b>${esc(ch.name)}</b></div></div>`:'';
  const cols=Array.from({length:R},(_,r)=>{
    const gs=koList(c).filter(g=>g.kr===r).sort((a,b)=>a.ks-b.ks);
    return`<div class="brc"><div class="brh">${koRoundName(R,r)}</div><div class="bms">${gs.map(g=>{
      const[h,a]=koTeams(c,g),w=koWinner(c,g),show=counted(g);
      const line=(id,gl,pn,isBye)=>{const t=tmById(c,id);return`<div class="bt ${w&&w===id?'w':''} ${!t?'tbd':''}">${badge(t,'sm')}<span class="nm">${t?esc(t.name):(isBye?'Folga (BYE)':'A definir')}</span><span class="g">${show&&t?(gl??0):''}${g.played&&t&&pn!=null&&g.hs===g.as?` <small>(${pn})</small>`:''}</span></div>`};
      return`<div class="bm" data-act="game" data-id="${esc(g.id)}">${g.live&&!g.played?'<div style="padding:4px 10px 0"><span class="live">Ao vivo</span></div>':''}${line(h,g.hs,g.ph,false)}${line(a,g.as,g.pa,g.bye)}</div>`;
    }).join('')}</div></div>`;
  }).join('');
  return`${tools}${banner}<div class="br">${cols}</div>`;
}

function statsView(c){
  const{T,goals,games,big,most}=totals(c),P=pstats(c);
  if(!games)return emptyBlock('Sem estatísticas ainda','As estatísticas aparecem a partir do primeiro jogo com resultado ou ao vivo. Gols, assistências e cartões são lançados no painel de cada partida.','');
  const pl=T.filter(x=>x.j>0);
  const avg=(n,j)=>(n/j).toFixed(2).replace('.',',');
  const{atk,def,win,fp,bad,inv}=statBest(T);
  const sc=P.list.filter(x=>x.gol>0).sort((a,b)=>b.gol-a.gol||a.player.localeCompare(b.player,'pt-BR'));
  const as=P.list.filter(x=>x.ast>0).sort((a,b)=>b.ast-a.ast||a.player.localeCompare(b.player,'pt-BR'));
  const cd=P.list.filter(x=>x.ama||x.ver).sort((a,b)=>b.ver-a.ver||b.ama-a.ama||a.player.localeCompare(b.player,'pt-BR'));
  const hatSet=new Set(P.hat.map(h=>h.player.toLowerCase()+'|'+h.team));
  const card=(label,val,sub,id)=>`<div class="kpi"><small>${label}</small><b>${val}</b><span>${sub||''}</span>${id?`<div class="who">${who(c,id)}</div>`:''}</div>`;
  const placar=x=>x?`${esc((tmById(c,x.h)||{}).name||'?')} ${x.hs} × ${x.as} ${esc((tmById(c,x.a)||{}).name||'?')}`:'—';
  const kpis=`<div class="kpis">
    ${card('Gols',goals,`${avg(goals,games)} por jogo · ${games} jogos`)}
    ${atk?card('Melhor ataque',atk.gp,`${avg(atk.gp,atk.j)} por jogo`,atk.id):''}
    ${def?card('Melhor defesa',def.gc,`${avg(def.gc,def.j)} sofridos por jogo`,def.id):''}
    ${win&&win.v?card('Mais vitórias',win.v,`em ${win.j} jogos`,win.id):''}
    ${big&&big.diff>0?card('Maior goleada',`${big.hs} × ${big.as}`,placar(big)):''}
    ${most&&most.tot>0?card('Jogo com mais gols',most.tot,placar(most)):''}
    ${fp?card('Fair play',fp.ama+3*fp.ver+' pts',`${fp.ama} amarelos, ${fp.ver} vermelhos`,fp.id):''}
    ${bad&&bad.ama+bad.ver>0?card('Mais cartões',bad.ama+bad.ver,`${bad.ama} amarelos, ${bad.ver} vermelhos`,bad.id):''}
    ${inv.length?card('Invictos',inv.length,inv.map(x=>esc((tmById(c,x.id)||{}).name)).join(', ')):''}
  </div>`;
  const tr=id=>`<div class="tn">${badge(tmById(c,id),'sm')}<span class="nm">${esc((tmById(c,id)||{}).name||'')}</span></div>`;
  const art=sc.length?`<table><thead><tr><th>#</th><th class="l">Jogador</th><th class="l hm">Time</th><th>Gols</th></tr></thead><tbody>${sc.slice(0,15).map((x,i)=>`<tr><td class="pos">${i+1}</td><td class="l"><b>${esc(x.player)}</b>${hatSet.has(x.player.toLowerCase()+'|'+x.team)?'<span class="ht">HAT-TRICK</span>':''}</td><td class="l hm">${tr(x.team)}</td><td class="pts">${x.gol}</td></tr>`).join('')}</tbody></table>`:`<div class="pad meta" style="text-align:center">Ainda sem gols com autor lançado.</div>`;
  const ast=as.length?`<table><thead><tr><th>#</th><th class="l">Jogador</th><th class="l hm">Time</th><th>Assist.</th></tr></thead><tbody>${as.slice(0,15).map((x,i)=>`<tr><td class="pos">${i+1}</td><td class="l"><b>${esc(x.player)}</b></td><td class="l hm">${tr(x.team)}</td><td class="pts">${x.ast}</td></tr>`).join('')}</tbody></table>`:`<div class="pad meta" style="text-align:center">Nenhuma assistência lançada. No painel da partida, ative "Perguntar assistência".</div>`;
  const cds=cd.length?`<table><thead><tr><th class="l">Jogador</th><th class="l hm">Time</th><th><span class="cd"></span></th><th><span class="cd r"></span></th></tr></thead><tbody>${cd.slice(0,15).map(x=>`<tr><td class="l"><b>${esc(x.player)}</b></td><td class="l hm">${tr(x.team)}</td><td>${x.ama||'-'}</td><td>${x.ver||'-'}</td></tr>`).join('')}</tbody></table>`:`<div class="pad meta" style="text-align:center">Nenhum cartão lançado.</div>`;
  const cmp=[...pl].sort((a,b)=>b.gp-a.gp||a.gc-b.gc).map(x=>`<tr><td class="l"><div class="tn">${badge(tmById(c,x.id),'sm')}<span class="nm">${esc((tmById(c,x.id)||{}).name)}</span></div></td><td>${x.j}</td><td>${x.v}</td><td>${x.e}</td><td>${x.d}</td><td>${x.gp}</td><td>${x.gc}</td><td>${avg(x.gp,x.j)}</td><td class="hm">${avg(x.gc,x.j)}</td></tr>`).join('');
  return`${kpis}<div class="two"><div class="card"><div class="th">Artilharia</div>${art}</div><div class="card"><div class="th">Assistências</div>${ast}</div></div><div class="two"><div class="card"><div class="th rd">Cartões</div>${cds}</div><div class="card"><div class="th yl">Ataque e defesa</div><div style="overflow-x:auto"><table><thead><tr><th class="l">Time</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>GP/J</th><th class="hm">GC/J</th></tr></thead><tbody>${cmp}</tbody></table></div></div></div>`;
}

function timesView(c){
  const nClubs=clubsAll().length;

function autoGame(c,pref){
  const real=c.games.filter(g=>!g.bye&&gTeams(c,g).every(Boolean));
  const live=real.find(g=>g.live&&!g.played);
  if(live)return live;
  const key=g=>(g.date||'9999')+(g.time||'');
  const next=real.filter(g=>!g.played).sort((a,b)=>key(a).localeCompare(key(b))||(a.round||0)-(b.round||0))[0];
  const last=[...real.filter(g=>g.played)].sort((a,b)=>key(b).localeCompare(key(a)))[0];
  return pref==='next'?(next||last||null):(last||next||null);
}
function tvLink(c,kind,arg){return location.href.split('#')[0]+'#tv-'+c.id+'-'+kind+(arg!==undefined&&arg!==''?'-'+arg:'')}
function ovStatus(g){
  if(g.played)return{t:'Encerrado',y:true};
  if(g.live)return{t:'Ao vivo',y:false};
  return{t:(fmtDate(g)||'Em breve'),y:true};
}

function gOrd(g){return g.phase==='ko'?100+(g.kr||0):(g.round||0)}
function gCmp(a,b){return String(a.date||'').localeCompare(String(b.date||''))||String(a.time||'').localeCompare(String(b.time||''))||gOrd(a)-gOrd(b)}
function teamLine(c,t){
  let row=null,pos=null;
  if(c.format!=='mata'){const rows=standings(c,t.group||'');const i=rows.findIndex(r=>r.id===t.id);if(i>=0){row=rows[i];pos=i+1}}
  if(!row){
    row={p:null,j:0,gp:0,gc:0};
    c.games.filter(g=>counted(g)&&!g.bye&&gTeams(c,g).includes(t.id)).forEach(g=>{const h=g.home===t.id;row.j++;row.gp+=(h?g.hs:g.as)||0;row.gc+=(h?g.as:g.hs)||0});
    row.sg=row.gp-row.gc;
  }
  return{row,pos};
}
function sheetTeam(c,g,id,other){
  
  const t=tmById(c,id),{row,pos}=teamLine(c,t);
  const mine=c.games.filter(x=>!x.bye&&gTeams(c,x).includes(id)&&gTeams(c,x).every(Boolean));
  const last=mine.filter(x=>x.played).sort(gCmp).slice(-5).reverse();
  const next=mine.filter(x=>!x.played&&x.id!==g.id).sort(gCmp).slice(0,4);
  const scorers=pstats(c).list.filter(p=>p.team===id&&p.gol>0).sort((a,b)=>b.gol-a.gol||a.player.localeCompare(b.player,'pt-BR')).slice(0,5);
  const opp=x=>{const[h,a]=gTeams(c,x);return tmById(c,h===id?a:h)};
  const lastH=last.length?last.map(x=>{
    const h=x.home===id,gf=(h?x.hs:x.as)||0,ga=(h?x.as:x.hs)||0;
    let r=gf>ga?'V':gf<ga?'D':'E';
    if(gf===ga&&x.ph!=null&&x.pa!=null){const pf=h?x.ph:x.pa,pa=h?x.pa:x.ph;r=pf>pa?'V':'D'}
    return`<div class="sh-li"><span class="rs ${r}">${r}</span><span class="n">${h?'':'@ '}${esc((opp(x)||{}).name||'?')}</span><span class="v">${gf} × ${ga}</span></div>`;
  }).join(''):'<div class="sh-none">Ainda sem jogos disputados.</div>';
  const nextH=next.length?next.map(x=>`<div class="sh-li"><span class="n"><b>${esc((opp(x)||{}).name||'?')}</b><br><span class="s">${esc(x.phase==='ko'?koTitle(c,x):roundLabel(c,x.round))}</span></span><span class="s">${esc(fmtDate(x)||'data a definir')}</span></div>`).join(''):'<div class="sh-none">Sem próximos jogos cadastrados.</div>';
  const scH=scorers.length?scorers.map(p=>`<div class="sh-li"><span class="n">${esc(p.player)}</span><span class="v">${p.gol}</span></div>`).join(''):'<div class="sh-none">Sem gols com autor lançado.</div>';
  const sg=row.sg??((row.gp||0)-(row.gc||0));
  return`<div>
    <div class="sh-kp"><div><b>${row.p==null?'–':row.p}</b><small>Pontos</small></div><div><b>${row.j}</b><small>Jogos</small></div><div><b>${row.gp}</b><small>Gols feitos</small></div><div><b>${row.gc}</b><small>Gols sofridos</small></div><div><b>${sg>0?'+':''}${sg}</b><small>Saldo</small></div></div>
    <div class="sh-sec">Últimos jogos</div>${lastH}
    <div class="sh-sec r">Artilheiros do time</div>${scH}
    <div class="sh-sec">Próximos jogos</div>${nextH}
  </div>`;
}

  if(vi)out+=`<div class="sh-info" style="margin:0"><b>Anotações</b>${esc(vi)}</div>`;

// ============ LOGOS (upload com redução automática) ============
function readLogo(file,max=160){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type))return rej(new Error('Escolha uma imagem (PNG, JPG ou WebP).'));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Não consegui ler o arquivo.'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('Imagem inválida.'));
      img.onload=()=>{
        try{
          let s=max,out='';
          for(let t=0;t<5;t++){
            const k=Math.min(1,s/Math.max(img.width,img.height)),cv=document.createElement('canvas');
            cv.width=Math.max(1,Math.round(img.width*k));cv.height=Math.max(1,Math.round(img.height*k));
            cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
            out=cv.toDataURL('image/webp',0.88);
            if(!/^data:image\/webp/.test(out))out=cv.toDataURL('image/png');
            if(out.length<45000)break;
            s=Math.round(s*0.75);
          }
          if(!safeImg(out))return rej(new Error('Formato de imagem não suportado.'));
          res(out);
        }catch(e){rej(new Error('Não consegui processar essa imagem.'))}
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function logoField(initial,txt){
  return`<div class="lgup"><span id="lgprev">${logoBadge(initial,'xl',txt)}</span><div><label class="btn ghost sm filebtn">Escolher imagem<input type="file" accept="image/*" id="lgfile"></label> <button type="button" class="btn danger sm" id="lgrm">Remover</button><div class="hint" style="margin:6px 0 0">PNG com fundo transparente fica melhor. A imagem é reduzida automaticamente.</div></div></div>`;
}
function wireLogo(f,initial,txt){
  const st={val:initial};
  const prev=f.querySelector('#lgprev');
  f.querySelector('#lgfile').addEventListener('change',async e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    try{st.val=await readLogo(file);prev.innerHTML=logoBadge(st.val,'xl',txt)}
    catch(er){const eb=$('#err');if(eb)eb.textContent=er.message}
    e.target.value='';
  });
  f.querySelector('#lgrm').addEventListener('click',()=>{st.val='';prev.innerHTML=logoBadge('','xl',txt)});
  return st;
}

function panelGame(){const c=cur();return c&&S.panel?{c,g:c.games.find(x=>x.id===S.panel.id)}:{}}
function panelAdd(kind,side,player,ast){
  const{c,g}=panelGame();if(!g)return;
  const[h,a]=gTeams(c,g),team=side==='h'?h:a,t=tmById(c,team);
  const min=num($('#pmin')&&$('#pmin').value);
  if(player&&t&&!(t.players||[]).includes(player)){t.players=t.players||[];t.players.push(player)}
  if(ast&&t&&!(t.players||[]).includes(ast)){t.players.push(ast)}
  addEvent(c,g,{type:kind,team,player:player||'',ast:ast||'',min});
  S.panel.step=null;S.panel.side=null;S.panel.kind=null;S.panel.scorer=undefined;
  commit(c);
}
function panelChoose(player){

  if(P.kind==='gol'&&S.askAst&&player){P.step='ast';P.scorer=player;refreshPanel();return}
  panelAdd(P.kind,P.side,player,'');
}

function tbModal(){
  const c=cur();
  const order=[...(c.tiebreak||TB_DEFAULT)].filter(k=>TB[k]);
  let all=[...order,...Object.keys(TB).filter(k=>!order.includes(k))],on=new Set(order);
  const body=`<p class="hint" style="margin-top:0">Pontos sempre vêm primeiro. Em caso de empate, o sistema aplica os critérios marcados, de cima para baixo, até desempatar. Se ainda sobrar empate, vale a ordem manual do time (campo no cadastro) e depois a ordem alfabética.</p><div class="g2" style="gap:8px;margin-bottom:10px"><button type="button" class="btn ghost sm" data-pre="def">Padrão (vitórias, saldo, gols)</button><button type="button" class="btn ghost sm" data-pre="h2h">Confronto direto primeiro</button></div><div id="tbbox"></div>`;
  const f=formModal('Critérios de desempate',body,'Salvar',()=>{c.tiebreak=all.filter(k=>on.has(k));commit(c)});
  const box=f.querySelector('#tbbox');
  const draw=()=>{box.innerHTML=all.map((k,i)=>`<div class="tbr ${on.has(k)?'':'off'}"><label class="chk"><input type="checkbox" data-k="${k}" ${on.has(k)?'checked':''}>${on.has(k)?`<b style="color:var(--blue)">${[...all].filter(x=>on.has(x)).indexOf(k)+1}º</b>`:''} ${esc(TB[k])}</label><span><button type="button" data-mv="-1" data-i="${i}" aria-label="Subir">↑</button> <button type="button" data-mv="1" data-i="${i}" aria-label="Descer">↓</button></span></div>`).join('')};
  f.addEventListener('click',e=>{
    const b=e.target.closest('[data-mv]');
    if(b){const i=+b.dataset.i,j=i+(+b.dataset.mv);if(j>=0&&j<all.length){[all[i],all[j]]=[all[j],all[i]];draw()}return}
    const p=e.target.closest('[data-pre]');
    if(p){const pre=p.dataset.pre==='def'?['v','sg','gp']:['h2h','h2hsg','v','sg','gp'];all=[...pre,...Object.keys(TB).filter(k=>!pre.includes(k))];on=new Set(pre);draw()}
  });
  f.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){e.target.checked?on.add(k):on.delete(k);draw()}});
  draw();
}

function koModal(){
  const c=cur();
  if(c.teams.length<2){toast('Cadastre pelo menos 2 times.');return}
  const hasKo=koRounds(c)>0;
  const def=c.format==='grupos'?(c.advance||2):c.format==='liga'?(c.advance||4):c.teams.length;
  const max=c.format==='grupos'?Math.max(1,...c.groups.map(g=>teamsOf(c,g).length)):c.teams.length;
  const lbl=c.format==='grupos'?'Classificados por grupo':'Quantos times entram';
  const q0=Math.min(def,max);
  const crossOk=c.format==='grupos'&&!crossPairs(c,q0).err;
  const defMode=crossOk?'cross':'seed';
  const body=`${hasKo?'<div class="warn">Já existe um chaveamento. Gerar um novo <b>apaga o atual</b>, com resultados.</div>':''}
  ${c.format==='grupos'?`<div class="warn">Confira se a fase de grupos terminou: os classificados saem da tabela atual.${c.extra?` Os ${c.extra} melhores ${(c.advance||0)+1}º colocados entram automaticamente (se você mantiver o número padrão de classificados por grupo).`:''}</div>`:''}
  <div class="g2"><label>${lbl}<input name="q" type="number" min="${c.format==='grupos'?1:2}" max="${max}" value="${q0}"></label>
  <label>Como montar os confrontos<select name="mode">
    ${c.format==='grupos'?`<option value="cross" ${defMode==='cross'?'selected':''}>Olímpico entre grupos (1º × último do outro)</option>`:''}
    <option value="seed" ${defMode==='seed'?'selected':''}>Por campanha (melhores × piores)</option>
    <option value="manual">Manual (escolho cada confronto)</option></select></label></div>
  <label class="chk" id="shufbox" style="display:none"><input type="checkbox" name="shuf" ${c.format==='mata'?'checked':''}> Sortear confrontos</label>
  <div class="sep" id="prevt">Confrontos</div><div id="seedprev" class="meta"></div>
  <p class="hint" id="prevh"></p>`;
  const f=formModal('Gerar chaveamento',body,'Gerar',fd=>{
    const q=num(fd.get('q'))||2,mode=fd.get('mode');
    if(mode==='cross'){
      const r=crossPairs(c,q);if(r.err)return r.err;
      genBracketPairs(c,r.pairs);commit(c);go(c.id,'mata');return;
    }
    const ids=seedList(c,q,mode==='seed'&&!!fd.get('shuf'));
    if(ids.length<2)return'São necessários pelo menos 2 times classificados.';
    if(mode==='manual'){setTimeout(()=>koManualModal(ids),0);return}
    genBracket(c,ids);commit(c);go(c.id,'mata');
  });
  const prev=()=>{
    const q=num(f.querySelector('[name=q]').value)||2,mode=f.querySelector('[name=mode]').value,shuf=f.querySelector('[name=shuf]').checked,ids=seedList(c,q,false);
    f.querySelector('#shufbox').style.display=mode==='seed'?'':'none';
    const box=f.querySelector('#seedprev'),hint=f.querySelector('#prevh'),title=f.querySelector('#prevt');
    if(mode==='cross'){
      const r=crossPairs(c,q);title.textContent='Confrontos da 1ª fase';
      box.innerHTML=r.err?`<span style="color:var(--red);font-weight:600">${esc(r.err)}</span>`:r.labels.map(p=>`${esc(p.lh)} × ${esc(p.la)} <span class="meta">(${esc((tmById(c,p.h)||{}).name)} × ${esc((tmById(c,p.a)||{}).name)})</span>`).join('<br>');
      hint.textContent='O 1º colocado de cada grupo enfrenta o último classificado do outro grupo. Os grupos são pareados na ordem (A com B, C com D...).';
    }else if(mode==='manual'){
      title.textContent='Classificados';box.innerHTML=ids.map((id,i)=>`${i+1}º ${esc((tmById(c,id)||{}).name)}`).join(' · ');
      hint.textContent='Na próxima tela você escolhe os dois times de cada confronto da 1ª fase.';
    }else{
      title.textContent='Cabeças de chave';
      box.innerHTML=(shuf?'<i>A ordem será sorteada ao gerar.</i> ':'')+ids.map((id,i)=>`${i+1}º ${esc((tmById(c,id)||{}).name)}`).join(' · ');
      hint.textContent='Com número de times que não é potência de 2, os melhores colocados avançam direto na 1ª fase (folga). Você pode ajustar os confrontos da 1ª fase depois.';
    }
  };
  ['q'].forEach(n=>f.querySelector(`[name=${n}]`).addEventListener('input',prev));
  f.querySelector('[name=mode]').addEventListener('change',prev);f.querySelector('[name=shuf]').addEventListener('change',prev);prev();
}
function koManualModal(ids){
  const c=cur();
  const size=nextPow2(ids.length),m=size/2,ord=bracketOrder(size);
  const std=Array.from({length:m},(_,s)=>[ids[ord[2*s]-1]||'',ids[ord[2*s+1]-1]||'']);
  const qs=new Set(ids);
  const opts=(val,bye)=>`${bye?'<option value="">— Folga (BYE) —</option>':'<option value="">Selecione…</option>'}<optgroup label="Classificados">${ids.map(id=>`<option value="${esc(id)}" ${id===val?'selected':''}>${esc((tmById(c,id)||{}).name)}</option>`).join('')}</optgroup><optgroup label="Outros times">${c.teams.filter(t=>!qs.has(t.id)).map(t=>`<option value="${esc(t.id)}" ${t.id===val?'selected':''}>${esc(t.name)}</option>`).join('')}</optgroup>`;
  const R=Math.log2(size),title=koRoundName(R,0);
  const body=`<p class="hint" style="margin-top:0">${esc(title)}: escolha os dois times de cada confronto. A ordem dos confrontos define o chaveamento: os vencedores de confrontos vizinhos se enfrentam na fase seguinte. Já vem preenchido por campanha, e você pode trocar.</p>${std.map((p,i)=>`<div class="g2" style="align-items:end"><label>Confronto ${i+1}: mandante<select name="h${i}">${opts(p[0],false)}</select></label><label>Visitante<select name="a${i}">${opts(p[1],true)}</select></label></div>`).join('')}`;
  formModal('Escolher confrontos',body,'Gerar chaveamento',fd=>{
    const pairs=[],used=new Set();
    for(let i=0;i<m;i++){
      const h=fd.get('h'+i)||'',a=fd.get('a'+i)||'';
      if(!h)return`Escolha o mandante do confronto ${i+1}.`;
      if(h===a)return`No confronto ${i+1}, os dois times são o mesmo.`;
      for(const x of [h,a])if(x){if(used.has(x))return`${(tmById(c,x)||{}).name} aparece em mais de um confronto.`;used.add(x)}
      pairs.push([h,a||null]);
    }
    genBracketPairs(c,pairs);commit(c);go(c.id,'mata');
  });
}

function copyText(txt,ta){
  const done=()=>toast('Copiado!');
  const fb=()=>{try{const t=ta||Object.assign(document.createElement('textarea'),{value:txt});if(!ta){document.body.appendChild(t)}t.select();const ok=document.execCommand('copy');if(!ta)t.remove();ok?done():toast('Selecione o texto e copie manualmente.')}catch(e){toast('Selecione o texto e copie manualmente.')}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(fb);else fb();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='ovclick'){if(e.target===el)closeModal();return}
  if(actions[a]){e.preventDefault();actions[a](el.dataset,el)}
});
document.addEventListener('change',e=>{
  const d=e.target.dataset||{};
  if(d.flt){S.flt[d.flt]=e.target.value;render()}
  else if(d.ast){S.ast=S.ast||{};S.ast[d.ast]=e.target.value;if(d.ast==='grp'){S.ast.tid=null;S.ast.gid=null}render()}
  else if(d.hf){S.hf=S.hf||{cat:'',div:'',team:''};S.hf[d.hf]=e.target.value;if(d.hf==='cat')S.hf.div='';render()}
  else if(d.chg==='askAst'){S.askAst=e.target.checked}
});
document.addEventListener('input',e=>{
  if(e.target.dataset&&'pmin' in e.target.dataset)S.lastMin=e.target.value;
});
document.addEventListener('keydown',e=>{
  const t=e.target,tag=t&&t.tagName;
  if(e.key==='Escape'){
    if(S.panel&&S.panel.step){e.preventDefault();actions.pCancel();return}
    if($('#modal').innerHTML){e.preventDefault();closeModal()}
    return;
  }
  if((e.key==='Enter'||e.key===' ')&&t&&t.dataset&&t.dataset.act&&!/^(BUTTON|INPUT|SELECT|TEXTAREA|A)$/.test(tag)){e.preventDefault();t.click();return}
  if(e.key==='Enter'&&t&&t.closest&&t.closest('#mf')&&!e.isComposing){
    const f=t.closest('#mf');
    if(tag==='TEXTAREA'){if(e.ctrlKey||e.metaKey){e.preventDefault();f.requestSubmit()}return}
    if(tag==='INPUT'&&!['file','button','submit','reset'].includes(t.type)){e.preventDefault();f.requestSubmit();return}
    if(tag==='SELECT')return;
  }
  if(e.key==='Enter'&&t&&t.id==='pcustom'){e.preventDefault();actions.pCustom();return}
  if(e.key==='Enter'&&!e.shiftKey&&!/^(TEXTAREA|BUTTON|SELECT|A|INPUT)$/.test(tag||'')||e.key==='Enter'&&tag==='SELECT'&&false){
    const m=$('#modal');if(!m||!m.innerHTML)return;
    if(S.fn){e.preventDefault();actions.doConfirm();return}
    if(m.querySelector('#sheetov')){e.preventDefault();actions.printSheet();return}
    if(m.querySelector('#pnwrap')||m.querySelector('form'))return;
    const b=m.querySelector('.mf-actions .btn:not(.ghost):not(.danger)');if(b){e.preventDefault();b.click()}
  }
});

const hHasTeam=(r,k)=>[r.champ,r.vice,r.fin&&r.fin.a,r.fin&&r.fin.b,...(r.sc||[]).flatMap(s=>String(s.t||'').split('/'))].some(n=>nk(n)===k);

function hScorers(r,plain){

  return block(th,kA)+block(ta,kB)+finH;
}

  const get=(k,n)=>{let o=cand.get(k);if(!o){o={k,name:String(n).trim(),short:'',color:'',logo:'',players:new Set(),cats:new Set(),src:new Set(),fromChamp:false};cand.set(k,o)}return o};
  champsAll().forEach(c=>c.teams.forEach(t=>{const k=nk(t.name);if(!k||have.has(k))return;const o=get(k,t.name);o.fromChamp=true;o.short=o.short||t.short||'';o.color=o.color||t.color||'';o.logo=o.logo||t.logo||'';(t.players||[]).forEach(p=>o.players.add(p));o.src.add(c.name)}));
  histAll().forEach(r=>[r.champ,r.vice].forEach(n=>{const k=nk(n);if(!k||have.has(k))return;get(k,n).cats.add(r.cat)}));
  const list=[...cand.values()].sort((a,b)=>(b.fromChamp-a.fromChamp)||a.name.localeCompare(b.name,'pt-BR'));
  if(!list.length)return toast('Todas as equipes dos campeonatos e do histórico já estão na biblioteca.');
  const cats=[...new Set(list.flatMap(o=>[...o.cats]))].sort((a,b)=>hCatRank(a)-hCatRank(b));
  const row=o=>`<label class="pick-row" data-q="${esc(o.k)}" data-cats="${esc([...o.cats].join('|'))}"><input type="checkbox" name="k" value="${esc(o.k)}" ${o.fromChamp?'checked':''}>${badge({name:o.name,short:o.short,color:o.color||'#004AAB',logo:o.logo},'sm')}<span class="pr-n"><b>${esc(o.name)}</b><small>${o.fromChamp?`${o.players.size} atletas · ${esc([...o.src].slice(0,2).join(', '))}`:''}${o.cats.size?(o.fromChamp?' · ':'')+'histórico: '+esc([...o.cats].join(', ')):''}</small></span></label>`;
  const body=`<p class="hint" style="margin-top:0">Equipes dos campeonatos já vêm marcadas, com logo, cor e elenco. As do histórico vêm com as categorias em que foram finalistas.</p>${pickHead('Filtrar equipes…',cats)}<div class="pick-list">${list.map(row).join('')}<div class="pick-none meta" hidden>Nenhuma equipe neste filtro.</div></div>`;
  const f=formModal('Importar equipes',body,'Salvar selecionadas',fd=>{
    const ks=new Set(fd.getAll('k').map(String));if(!ks.size)return'Marque pelo menos uma equipe.';
    let n=0;
    list.filter(o=>ks.has(o.k)).forEach(o=>{const rec={id:uid('cl'),kind:'club',createdAt:Date.now(),updatedAt:Date.now(),name:o.name,short:(o.short||clubShort(o.name)).toUpperCase().slice(0,4),color:safeColor(o.color||'#004AAB'),logo:o.logo||'',cats:[...o.cats],players:[...o.players].slice(0,80)};S.champs[rec.id]=rec;queueSave(rec.id);n++});
    render();toast(`${n} equipe${n>1?'s':''} salva${n>1?'s':''} na biblioteca.`);
  });
  wirePick(f);
}
function clubAddModal(){
  const c=cur();if(!c)return;
  const all=clubsAll();
  if(!all.length)return infoModal('Biblioteca vazia','<p style="margin:0">Você ainda não tem equipes salvas. Abra <b>Equipes</b> no topo para criar ou importar as que já existem nos seus campeonatos.</p>',`<button class="btn" data-act="clubGoLib">Abrir Equipes</button>`);
  const hon=clubHonors();
  const has=cl=>c.teams.some(t=>t.club===cl.id||nk(t.name)===nk(cl.name));
  const cats=[...new Set(all.flatMap(cl=>clubCatsOf(cl,hon)))].sort((a,b)=>hCatRank(a)-hCatRank(b));
  const row=cl=>{const h=has(cl),cs=clubCatsOf(cl,hon);return`<label class="pick-row ${h?'dis':''}" data-q="${esc(nk(cl.name))}" data-cats="${esc(cs.join('|'))}"><input type="checkbox" name="cl" value="${esc(cl.id)}" ${h?'disabled checked':''}>${badge(cl,'sm')}<span class="pr-n"><b>${esc(cl.name)}</b><small>${h?'Já está neste campeonato':`${(cl.players||[]).length} atletas${cs.length?' · '+esc(cs.join(', ')):''}`}</small></span></label>`};
  const grp=c.format==='grupos'?`<label>Grupo das equipes adicionadas${sel('group',c.groups.map(g=>[g,'Grupo '+g]),c.groups[0])}</label>`:'';
  const body=`${pickHead('Buscar na biblioteca…',cats)}<div class="pick-list">${all.map(row).join('')}<div class="pick-none meta" hidden>Nenhuma equipe neste filtro.</div></div>${grp}<label class="chk"><input type="checkbox" name="roster" checked> Copiar o elenco salvo (dá para ajustar depois em “Editar elenco”)</label>`;
  const f=formModal('Adicionar da biblioteca',body,'Adicionar ao campeonato',fd=>{
    const ids=fd.getAll('cl').map(String).filter(id=>{const cl=S.champs[id];return isClub(cl)&&!has(cl)});
    if(!ids.length)return'Marque pelo menos uma equipe.';
    const roster=!!fd.get('roster'),g=c.format==='grupos'?(fd.get('group')||c.groups[0]):'';
    ids.forEach(id=>{const cl=S.champs[id];c.teams.push({id:uid('t'),name:cl.name,short:cl.short||clubShort(cl.name),color:safeColor(cl.color),logo:cl.logo||'',seed:null,group:g,players:roster?[...(cl.players||[])]:[],club:cl.id})});
    commit(c);toast(`${ids.length} equipe${ids.length>1?'s':''} adicionada${ids.length>1?'s':''}. Toque em “Editar elenco” para ajustar.`);
  });
  wirePick(f);
}
Object.assign(actions,{
  goClubs:()=>{S.route={id:null,tab:null,sid:null,eq:true};try{location.hash='e'}catch(e){}render();window.scrollTo(0,0)},
  clubGoLib:()=>{closeModal();actions.goClubs()},
  clubGoCamp:d=>{closeModal();go(d.id,'times')},
  clubCat:d=>{S.ccat=d.v||'';render()},
  clubOpen:d=>clubModal(d.id),
  clubNew:()=>clubForm(null),
  clubEdit:d=>{closeModal();clubForm(d.id)},
  clubDel:d=>{const cl=S.champs[d.id];if(!isClub(cl))return;confirmModal(`Excluir "${cl.name}" da biblioteca? Os campeonatos que já usam essa equipe não mudam.`,'Excluir',()=>{S.deleting[cl.id]=true;delete S.champs[cl.id];queueSave(cl.id);render()})},
  clubImport,
  clubAdd:clubAddModal,
  clubSave:d=>{const c=cur(),t=c&&tmById(c,d.id);if(!t)return;const had=t.club&&isClub(S.champs[t.club]);saveTeamToClub(t);commit(c);toast(had?`"${t.name}" atualizada na biblioteca.`:`"${t.name}" salva na biblioteca de Equipes.`)},
  clubSaveAll:()=>{const c=cur();if(!c||!c.teams.length)return;c.teams.forEach(saveTeamToClub);commit(c);toast(`${c.teams.length} equipes salvas/atualizadas na biblioteca.`)},
  hfSet:d=>{S.hf=S.hf||{cat:'',div:'',team:''};S.hf[d.k]=d.v||'';if(d.k==='cat')S.hf.div='';render()},
  hfTeam:d=>{S.hf=S.hf||{cat:'',div:'',team:''};S.hf.team=S.hf.team===d.v?'':d.v;render();const h=document.getElementById('hfx');if(h)h.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})},
  hfClear:()=>{S.hf={cat:'',div:'',team:''};render()},
  hView:d=>{S.hv=d.v;render()},
});
{const bl=$('#brandlogo');if(bl)bl.src=RC_LOGO;const fv=$('#favi');if(fv)fv.href=RC_LOGO}
parseHash();renderTop();initStore();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
// ============ CAMADA DE MOVIMENTO (GSAP) ============
// Envolve render/toast/modais sem alterar a lógica. Se o GSAP não carregar, a página segue com as animações CSS antigas.
(()=>{
  if(!window.gsap)return;
  const root=document.documentElement;root.classList.add('gs');
  if(window.ScrollTrigger)gsap.registerPlugin(ScrollTrigger);
  const RM=matchMedia('(prefers-reduced-motion: reduce)'),FINE=matchMedia('(hover:hover) and (pointer:fine)'),MOB=matchMedia('(max-width:700px)');
  const reduced=()=>RM.matches;
  gsap.defaults({ease:'power3.out',duration:.45,overwrite:'auto'});
  const app=$('#app'),modal=$('#modal'),top=$('.top');

  // ---- topo: altura (para abas fixas) e sombra ao rolar ----
  const setTopH=()=>root.style.setProperty('--top-h',top.offsetHeight+'px');
  setTopH();if(window.ResizeObserver)new ResizeObserver(setTopH).observe(top);
  const toTop=document.createElement('button');
  toTop.className='totop';toTop.type='button';toTop.setAttribute('aria-label','Voltar ao topo');toTop.innerHTML='↑';
  toTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'}));
  document.body.appendChild(toTop);
  let ticking=false;
  addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{ticking=false;top.classList.toggle('scrolled',scrollY>8);toTop.classList.toggle('show',scrollY>700&&!S.tv)})},{passive:true});

  // ---- holofote que segue o mouse nos cards (só desktop) ----
  app.addEventListener('pointermove',e=>{
    if(!FINE.matches)return;const c=e.target.closest('.cc');if(!c)return;
    const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px');
  },{passive:true});

  // ---- abas com indicador deslizante ----
  function tabInfo(){
    const tabs=app.querySelector('.tabs');if(!tabs)return null;
    const on=tabs.querySelector('button.on');if(!on)return null;
    return{tabs,on,x:on.offsetLeft,w:on.offsetWidth,scroll:tabs.scrollLeft};
  }
  function setupTabs(prev,slide){
    const t=tabInfo();if(!t)return;
    const ind=document.createElement('i');ind.className='tind';t.tabs.appendChild(ind);
    if(prev)t.tabs.scrollLeft=prev.scroll; // a re-renderização zerava a rolagem horizontal
    const to={x:t.x,scaleX:t.w};
    if(slide&&prev&&!reduced())gsap.fromTo(ind,{x:prev.x,scaleX:prev.w},{...to,duration:.36,ease:'power3.inOut'});
    else gsap.set(ind,to);
    if(t.tabs.scrollWidth>t.tabs.clientWidth){
      const left=t.x-(t.tabs.clientWidth-t.w)/2;
      t.tabs.scrollTo({left,behavior:reduced()||!slide?'auto':'smooth'});
    }
  }

  // ---- números que contam (KPIs e cards) ----
  function countUp(scope){
    if(reduced())return;
    scope.querySelectorAll('.nums b,.kpi b').forEach(b=>{
      const txt=b.textContent.trim();if(!/^\d{1,4}$/.test(txt))return;
      const n=+txt;if(n<2)return;
      const r=b.getBoundingClientRect();if(r.top>innerHeight)return;
      const o={v:0};gsap.to(o,{v:n,duration:.8,ease:'power2.out',onUpdate:()=>{b.textContent=Math.round(o.v)},onComplete:()=>{b.textContent=txt}});
    });
  }

  // ---- entrada de página/aba ----
  const ROWS='.grid,.tg,.kpis,.tvg,.two';
  function enter(tabOnly){
    if(window.ScrollTrigger)ScrollTrigger.getAll().forEach(s=>s.kill());
    let blocks=[...app.children];
    if(tabOnly){
      const tabs=app.querySelector('.tabs');
      if(tabs){let top=tabs;while(top.parentElement&&top.parentElement!==app)top=top.parentElement;const i=blocks.indexOf(top);blocks=blocks.slice(i+1)}
    }
    if(!blocks.length)return;
    if(reduced()){gsap.fromTo(blocks,{autoAlpha:0},{autoAlpha:1,duration:.2,ease:'none',clearProps:'opacity,visibility'});return}
    const items=[];blocks.forEach(b=>{if(b.matches(ROWS))items.push(...b.children);else items.push(b)});
    const vh=innerHeight,now=[],later=[];
    items.forEach(el=>(el.getBoundingClientRect().top<vh-24?now:later).push(el));
    gsap.fromTo(now,{autoAlpha:0,y:tabOnly?8:16},{autoAlpha:1,y:0,duration:tabOnly?.32:.5,
      stagger:i=>Math.min(.05*Math.pow(i,.8),.32), // atraso não-uniforme e limitado
      clearProps:'transform,opacity,visibility'});
    if(later.length&&window.ScrollTrigger){
      gsap.set(later,{autoAlpha:0,y:20});
      ScrollTrigger.batch(later,{start:'top 94%',once:true,
        onEnter:b=>gsap.to(b,{autoAlpha:1,y:0,duration:.5,stagger:.06,clearProps:'transform,opacity,visibility'})});
    }
    if(!tabOnly)countUp(app);
  }

  // ---- transições por chave (data-k): FLIP de posição, barras que crescem, itens novos surgem ----
  function snapKeys(){
    const m=new Map();
    const els=app.querySelectorAll('[data-k]');if(els.length>500)return m;
    els.forEach(el=>{
      const r=el.getBoundingClientRect();
      m.set(el.dataset.k,{top:r.top,left:r.left,w:[...el.querySelectorAll('[data-w]')].map(x=>x.style.width)});
    });
    const sw=app.querySelectorAll('.simprog [data-w]');sw.forEach((x,i)=>m.set('__sp'+i,{w:[x.style.width]}));
    return m;
  }
  function playKeys(prev){
    if(!prev||!prev.size||reduced())return;
    const vh=innerHeight,news=[];
    app.querySelectorAll('[data-k]').forEach(el=>{
      const r=el.getBoundingClientRect();if(r.bottom<-50||r.top>vh+50)return;
      const o=prev.get(el.dataset.k);
      if(!o){news.push(el);return}
      const dy=o.top-r.top,dx=o.left-r.left;
      if(Math.abs(dy)>1||Math.abs(dx)>1)gsap.fromTo(el,{x:dx,y:dy},{x:0,y:0,duration:.5,ease:'power3.inOut',clearProps:'transform'});
      el.querySelectorAll('[data-w]').forEach((b,i)=>{const w0=o.w[i];if(w0!=null&&w0!==b.style.width)gsap.fromTo(b,{width:w0},{width:b.style.width,duration:.55,ease:'power3.out'})});
    });
    app.querySelectorAll('.simprog [data-w]').forEach((b,i)=>{const o=prev.get('__sp'+i);if(o&&o.w[0]!==b.style.width)gsap.fromTo(b,{width:o.w[0]},{width:b.style.width,duration:.4})});
    if(news.length&&news.length<60)gsap.fromTo(news,{autoAlpha:0,y:8,scale:.98},{autoAlpha:1,y:0,scale:1,duration:.35,stagger:Math.min(.03,.3/news.length),clearProps:'transform,opacity,visibility'});
  }

  // ---- envolve render() ----
  let last=null;
  const _render=render;
  render=function(){
    const r0=S.route;
    const prevTabs=(last&&last.id&&last.id===r0.id&&!r0.sid&&!r0.h)?tabInfo():null;
    const keys=last?snapKeys():null;
    _render.apply(this,arguments);
    if(S.tv||!S.loaded){last=null;return}
    const r=S.route,changed=app.classList.contains('anim');
    const sameChamp=!!(last&&last.id&&last.id===r.id&&!r.sid&&!r.h&&!last.h&&!last.sid);
    setupTabs(prevTabs,changed&&sameChamp&&last.tab!==r.tab);
    if(changed)enter(sameChamp);else playKeys(keys);
    last={...r};
  };

  // ---- modais: entrada, saída, bottom-sheet arrastável ----
  const ghost=document.createElement('div');ghost.id='mghost';document.body.appendChild(ghost);
  const lock=()=>document.body.classList.toggle('mopen',!!modal.querySelector(':scope>.ov'));
  function addGrab(md){
    if(!md||md.querySelector(':scope>.grab'))return;
    const g=document.createElement('div');g.className='grab';g.setAttribute('aria-hidden','true');md.prepend(g);
    let y0=0,t0=0,dy=0,drag=false;
    g.addEventListener('pointerdown',e=>{if(!MOB.matches||e.button>0)return;drag=true;y0=e.clientY;t0=performance.now();dy=0;g.setPointerCapture(e.pointerId);gsap.killTweensOf(md)});
    g.addEventListener('pointermove',e=>{if(!drag)return;dy=e.clientY-y0;gsap.set(md,{y:dy>0?dy:-Math.sqrt(-dy)*2})}); // fricção ao puxar para cima
    const end=()=>{
      if(!drag)return;drag=false;
      const v=dy/Math.max(1,performance.now()-t0);
      if(dy>130||(dy>12&&v>.45))closeModal(); // arrastar longe OU um "peteleco" rápido fecha
      else gsap.to(md,{y:0,duration:.45,ease:'expo.out'});
    };
    g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  }
  function openAnim(ov,swap){
    const md=ov.querySelector('.md');if(!md)return;
    addGrab(md);lock();
    if(reduced()){gsap.fromTo(ov,{autoAlpha:0},{autoAlpha:1,duration:.15});return}
    if(!swap)gsap.fromTo(ov,{autoAlpha:0},{autoAlpha:1,duration:.22,ease:'power1.out'});
    if(MOB.matches)gsap.fromTo(md,{yPercent:swap?6:100},{yPercent:0,duration:swap?.3:.5,ease:'expo.out',clearProps:'transform'});
    else gsap.fromTo(md,{autoAlpha:0,y:14,scale:.97},{autoAlpha:1,y:0,scale:1,duration:.32,ease:'power3.out',clearProps:'transform,opacity,visibility'});
  }
  new MutationObserver(recs=>{
    const ov=modal.querySelector(':scope>.ov');
    if(ov&&!ov._in){
      ov._in=1;
      const swap=recs.some(r=>[...r.removedNodes].some(n=>n.classList&&n.classList.contains('ov')));
      openAnim(ov,swap);
    }else lock();
  }).observe(modal,{childList:true});
  const _close=closeModal;
  closeModal=function(){
    const ov=modal.querySelector(':scope>.ov');
    if(!ov||reduced()){_close.apply(this,arguments);lock();return}
    modal.removeChild(ov);                 // tira o nó antes de limpar, para animar a saída
    ov.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
    _close.apply(this,arguments);lock();
    ghost.appendChild(ov);
    const md=ov.querySelector('.md');
    gsap.to(ov,{autoAlpha:0,duration:.2,ease:'power1.out',onComplete:()=>ov.remove()});
    if(md){if(MOB.matches)gsap.to(md,{yPercent:100,duration:.26,ease:'power2.out'});else gsap.to(md,{y:8,scale:.98,duration:.18,ease:'power2.out'})}
  };

  // ---- painel da partida: alça + "pop" quando o placar muda ----
  const _rp=refreshPanel;
  refreshPanel=function(){
    const w0=$('#pnwrap');
    const before=w0?[...w0.querySelectorAll('.pn-num .n')].map(n=>n.textContent):[];
    const hadPick=!!(w0&&w0.querySelector('.pick'));
    _rp.apply(this,arguments);
    const w=$('#pnwrap');if(!w)return;
    addGrab(w);
    if(reduced())return;
    w.querySelectorAll('.pn-num .n').forEach((n,i)=>{
      if(before.length&&before[i]!==undefined&&before[i]!==n.textContent)
        gsap.fromTo(n,{scale:1.45,color:'#FFB900'},{scale:1,color:'#ffffff',duration:.65,ease:'back.out(2.2)',clearProps:'transform,color'});
    });
    const pk=w.querySelector('.pick');
    if(pk&&!hadPick)gsap.fromTo(pk,{autoAlpha:0,y:8},{autoAlpha:1,y:0,duration:.25,clearProps:'transform,opacity,visibility'});
  };

  // ---- toast com entrada/saída e toque para fechar ----
  const hideToast=el=>gsap.to(el,{y:12,autoAlpha:0,duration:.2,ease:'power2.out',onComplete:()=>el.remove()});
  toast=function(m){
    const t=$('#toast');if(!t)return;
    clearTimeout(toast.t);
    const had=!!t.firstElementChild;
    t.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;
    const el=t.firstElementChild;
    el.addEventListener('click',()=>{clearTimeout(toast.t);hideToast(el)});
    gsap.set(el,{x:0,xPercent:0}); // a regra antiga usava translateX(-50%); centralizamos por margem
    if(!reduced())had?gsap.fromTo(el,{scale:.96},{scale:1,duration:.2}):gsap.fromTo(el,{y:24,autoAlpha:0},{y:0,autoAlpha:1,duration:.4});
    toast.t=setTimeout(()=>hideToast(el),4200);
  };

  // ---- troca de tema: revelação circular a partir do botão ----
  const _theme=actions.theme;
  actions.theme=(d,el)=>{
    if(!document.startViewTransition||reduced()||!el)return _theme(d,el);
    const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
    const rad=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
    const vt=document.startViewTransition(()=>{_theme(d,el)});
    vt.ready.then(()=>root.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${rad}px at ${x}px ${y}px)`]},{duration:520,easing:'cubic-bezier(.23,1,.32,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
  };

  // primeira pintura (se os dados já chegaram antes do GSAP)
  if(S.loaded&&!S.tv){app.classList.add('anim');setupTabs(null,false);enter(false);last={...S.route}}
  if(!S.tv)gsap.from('.top-in>*',{autoAlpha:0,y:-8,duration:.4,stagger:.06,clearProps:'transform,opacity,visibility'});
})();
</script>
